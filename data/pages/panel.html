<!doctype html>
<html lang="es">
<head>
<script>try{var t=JSON.parse(localStorage.getItem("va:theme"));if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1E30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anillo Travel">
<meta name="robots" content="noindex, nofollow">
<title>Panel del organizador</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Marcellus&display=swap">
<style>
/* Layout: misma marca que la app. Cabecera azul noche, barra de herramientas tipo explorador (buscar, filtros, lista/cuadrados) y la colección de viajes debajo. Ancha en ordenador, una columna en el móvil. */
:root {
  --bg: #F2F5F7; --surface: #FFFFFF; --surface-2: #E8EEF2; --ink: #0E2233; --muted: #586A78; --line: #D8E1E7;
  --brand: #0B3B5C; --brand-ink: #0B3B5C; --brand-deep: #0A1E30; --accent: #C9973A; --accent-ink: #8A6216;
  --sea: #14898F; --sea-soft: #DCEFEF; --ok: #2E8B57; --ok-soft: #DDF1E5; --warn: #A86A0B; --warn-soft: #FBF1DC; --danger: #C2412D;
  --row-hover: #F6F9FB; --sel: #E4F0F7; --on-brand: #FFFFFF; --scrim: rgba(6,18,28,.5);
  --shadow: 0 1px 2px rgba(14,34,51,.06), 0 8px 24px rgba(14,34,51,.08);
  --font-display: "Marcellus", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07121B; --surface: #0E1D2A; --surface-2: #142838; --ink: #EAF1F5; --muted: #98AAB7; --line: #1E3344;
    --brand-ink: #9CCBEA; --accent: #E0B35A; --accent-ink: #E8C27A; --sea: #44C2C7; --sea-soft: #10303A; --ok: #5BC48A; --ok-soft: #12301F; --warn: #E8B45A; --warn-soft: #2B2414;
    --row-hover: #122433; --sel: #15324A; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07121B; --surface: #0E1D2A; --surface-2: #142838; --ink: #EAF1F5; --muted: #98AAB7; --line: #1E3344;
  --brand-ink: #9CCBEA; --accent: #E0B35A; --accent-ink: #E8C27A; --sea: #44C2C7; --sea-soft: #10303A; --ok: #5BC48A; --ok-soft: #12301F; --warn: #E8B45A; --warn-soft: #2B2414;
  --row-hover: #122433; --sel: #15324A; --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 16px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); letter-spacing: .05em; }
.muted { color: var(--muted); }
.ic { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Cabecera del panel ---------- */
.top { background: var(--brand-deep); color: #fff; padding-top: calc(env(safe-area-inset-top, 0px) + 10px); }
.top .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px; }
.top .logo svg { width: 132px; height: auto; color: #fff; display: block; }
.top .who { margin-left: auto; text-align: right; font-size: 13px; color: rgba(255,255,255,.7); line-height: 1.3; }
.top .who b { display: block; color: #fff; font-size: 15px; font-weight: 600; }
.icon-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.06); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; }
.hero { background: var(--brand-deep); color: #fff; }
.hero .wrap { padding-block: 6px 26px; display: grid; gap: 18px; }
.hero h1 { font-size: clamp(28px, 4vw, 38px); line-height: 1.1; }
.hero .sub { color: rgba(255,255,255,.72); font-size: 15px; margin-top: 6px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { text-align: left; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); border-radius: 14px; padding: 12px 14px; color: #fff; cursor: pointer; display: grid; gap: 2px; min-width: 0; }
.stat b { font-size: 24px; font-weight: 700; line-height: 1.1; }
.stat span { font-size: 13px; color: rgba(255,255,255,.72); }
.stat[aria-pressed="true"] { border-color: var(--accent); background: rgba(201,151,58,.16); }
.stat .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.next { display: flex; gap: 12px; align-items: center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 12px 14px; cursor: pointer; color: #fff; text-align: left; width: 100%; }
.next .k { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.next .t { font-weight: 600; }
.next .m { font-size: 14px; color: rgba(255,255,255,.72); }
.next .go { margin-left: auto; }
.newbar { display: flex; gap: 10px; align-items: center; background: var(--accent); color: #1B1406; border-radius: 12px; padding: 10px 14px; font-weight: 600; font-size: 15px; }
.newbar .nt { flex: 1; min-width: 0; }
.newbar .tag.new { background: rgba(0,0,0,.14); }
.newbar button { margin-left: auto; border: 0; background: rgba(0,0,0,.12); border-radius: 10px; padding: 6px 10px; font-weight: 600; cursor: pointer; color: inherit; }

/* ---------- Barra de herramientas ---------- */
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand-deep); }
.tools .wrap { display: grid; gap: 10px; padding-block: 12px; }
.row1 { display: flex; gap: 10px; align-items: center; }
.search { flex: 1; min-width: 0; position: relative; }
.search .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px 0 40px; font-size: 16px; }
.search input:focus { outline: none; border-color: var(--sea); }
.seg { display: inline-flex; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 3px; flex: none; }
.seg button { border: 0; background: none; height: 36px; min-width: 40px; padding: 0 10px; border-radius: 9px; cursor: pointer; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.seg .lbl { display: none; }
@media (min-width: 720px) { .seg .lbl { display: inline; } }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; margin-inline: -2px; padding-inline: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--sea-soft); border-color: var(--sea); color: var(--ink); }
.chip select { border: 0; background: none; font-weight: 600; font-size: 14px; padding: 0; cursor: pointer; }
.chip select:focus { outline: none; }
.chip.sep { border: 0; background: none; padding: 0 2px; color: var(--muted); cursor: default; font-weight: 500; }
.range { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
.range input { height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 10px; }
.count { font-size: 14px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.count .clear { border: 0; background: none; color: var(--sea); font-weight: 600; cursor: pointer; padding: 0; font-size: 14px; }

/* ---------- Estado ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.prox { background: var(--sea-soft); color: var(--sea); }
.pill.curso { background: var(--ok-soft); color: var(--ok); }
.pill.fin { background: var(--surface-2); color: var(--muted); }
.type { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; flex: none; }
.type.ANI { background: var(--sea-soft); color: var(--sea); }
.type.FLY { background: var(--warn-soft); color: var(--accent-ink); }
.tag { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .08em; padding: 2px 7px; border-radius: 6px; vertical-align: 2px; }
.tag.new { background: var(--accent); color: #1B1406; }
.tag.demo { background: var(--surface-2); color: var(--muted); }
.tag.ej { background: var(--surface-2); color: var(--muted); font-style: italic; }
.exp-soon { color: var(--warn); font-weight: 600; }

/* ---------- Vista lista ---------- */
main { padding-block: 16px 60px; }
.table-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
thead th { text-align: left; font-size: 13px; font-weight: 600; color: var(--muted); padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
thead th button { border: 0; background: none; width: 100%; text-align: left; padding: 12px 14px; cursor: pointer; color: inherit; font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
thead th button:hover { color: var(--ink); background: var(--row-hover); }
thead th[aria-sort] button { color: var(--ink); }
.arrow { width: 14px; height: 14px; }
tbody tr { border-bottom: 1px solid var(--line); cursor: pointer; }
tbody tr:last-child { border-bottom: 0; }
tbody tr:hover { background: var(--row-hover); }
tbody td { padding: 12px 14px; vertical-align: middle; }
.c-main { display: flex; gap: 12px; align-items: center; min-width: 0; }
.c-main .t { font-weight: 600; }
.c-main .s { font-size: 13px; color: var(--muted); }
.codecell { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-weight: 600; letter-spacing: .05em; white-space: nowrap; }
.mini { width: 32px; height: 32px; border-radius: 9px; border: 1px solid transparent; background: none; color: var(--muted); display: inline-grid; place-items: center; cursor: pointer; }
.mini:hover { border-color: var(--line); color: var(--ink); background: var(--surface); }
.mini .ic { width: 18px; height: 18px; }
.acts { display: flex; gap: 2px; justify-content: flex-end; }
td.nowrap { white-space: nowrap; }

/* Lista en el móvil: filas de dos líneas en vez de columnas */
.mlist { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.mrow { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); cursor: pointer; width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.mrow:last-child { border-bottom: 0; }
.mrow .mid { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mrow .l1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.mrow .l1 b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mrow .l2, .mrow .l3 { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .l3 .mono { color: var(--ink); font-weight: 600; }
.mrow .right { display: grid; gap: 4px; justify-items: end; flex: none; }
@media (max-width: 860px) { .table-wrap { display: none; } .mlist { display: block; } }

/* ---------- Vista cuadrados ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0; transition: transform .15s ease, box-shadow .15s ease; color: var(--ink); }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tile .ph { aspect-ratio: 16 / 10; max-width: 100%; background: var(--surface-2) center / cover no-repeat; position: relative; }
.tile .ph .pill { position: absolute; left: 10px; bottom: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.2); }
.tile .ph .tg { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; }
.tile .ph .typ { position: absolute; left: 10px; top: 10px; background: rgba(6,26,43,.72); color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .1em; padding: 4px 8px; border-radius: 7px; display: inline-flex; gap: 5px; align-items: center; }
.tile .ph .typ .ic { width: 14px; height: 14px; }
.tile .bd { padding: 12px 14px 14px; display: grid; gap: 4px; min-width: 0; }
.tile .cd { font-family: var(--font-mono); font-weight: 700; letter-spacing: .06em; font-size: 15px; color: var(--brand-ink); }
.tile .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .ds { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .dt { font-size: 13px; color: var(--muted); }
.tile .bar { height: 4px; border-radius: 4px; background: var(--surface-2); overflow: hidden; margin-top: 4px; }
.tile .bar i { display: block; height: 100%; background: var(--ok); }
@media (max-width: 520px) { .tile .bd { padding: 10px 11px 12px; } .tile .cd { font-size: 13px; } .tile .nm { font-size: 14px; } .tile .ph .pill { font-size: 12px; height: 23px; padding: 0 8px; } }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); font-size: 17px; }

/* ---------- Ficha del viaje ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: grid; place-items: center; padding: 20px; animation: fade .2s ease both; }
@keyframes fade { from { opacity: 0; } }
.sheet { background: var(--surface); width: min(560px, 100%); max-height: calc(100dvh - 40px); overflow: auto; border-radius: 22px; box-shadow: var(--shadow); animation: up .25s ease both; }
@keyframes up { from { transform: translateY(24px); opacity: .5; } }
@media (max-width: 620px) {
  .scrim { place-items: end stretch; padding: 0; }
  .sheet { width: 100%; max-height: 92dvh; border-radius: 22px 22px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.sheet .cover { aspect-ratio: 16 / 7; max-width: 100%; background: var(--surface-2) center / cover no-repeat; position: relative; }
.sheet .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,26,43,0) 40%, rgba(6,26,43,.75)); }
.sheet .cover .x { position: absolute; right: 12px; top: 12px; z-index: 1; background: rgba(6,26,43,.55); border-color: rgba(255,255,255,.25); }
.sheet .cover .ttl { position: absolute; left: 18px; right: 18px; bottom: 14px; z-index: 1; color: #fff; }
.sheet .cover h2 { font-size: 26px; line-height: 1.15; }
.sheet .cover .st { font-size: 14px; color: rgba(255,255,255,.82); }
.sheet .in { padding: 18px; display: grid; gap: 16px; }
.bigcode { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
.bigcode .mono { font-size: 24px; font-weight: 700; letter-spacing: .12em; color: var(--brand-ink); }
.bigcode .l { font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-weight: 700; }
.bigcode .btn { margin-left: auto; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.facts dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.facts dd small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
.timeline { display: grid; gap: 6px; }
.flights { display: grid; gap: 8px; }
.flights h3 { font-family: inherit; font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.fl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.fl .d { font-size: 13px; color: var(--muted); font-weight: 600; white-space: nowrap; min-width: 46px; }
.fl .r { font-weight: 700; }
.fl .r small { font-weight: 500; color: var(--muted); font-size: 12px; }
.fl .n { grid-column: 2; font-size: 13px; color: var(--muted); }
.fl-sep { font-size: 12px; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; }
.hero .hi { font-size: 15px; color: rgba(255,255,255,.72); margin-bottom: 4px; }
.timeline .track { height: 8px; border-radius: 8px; background: var(--surface-2); position: relative; overflow: hidden; }
.timeline .track i { position: absolute; inset: 0 auto 0 0; background: var(--ok); border-radius: 8px; }
.timeline .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.btn { height: 46px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; text-decoration: none; color: var(--ink); padding: 0 14px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.wa { background: #1F8F4E; border-color: #1F8F4E; color: #fff; }
.btn.full { grid-column: 1 / -1; }
.note label { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 6px; }
.note textarea { width: 100%; min-height: 76px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ink); resize: vertical; }
.note small { color: var(--muted); font-size: 12px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--brand-deep); color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 15px; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px); }

@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .top .who { display: none; }
  .top .logo { margin-right: auto; }
}

.mrow .l3 { white-space: normal; overflow: visible; }
.mrow .l3 .num { white-space: nowrap; }
a.phone { color: var(--sea); font-weight: 600; text-decoration: none; white-space: nowrap; font-size: 14px; }
.facts a.phone { font-size: inherit; }
html.lock, html.lock body { overflow: hidden; }
.sheet { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tile .ph, .tile .bd, .tile .cd, .tile .nm, .tile .ds, .tile .dt, .tile .bar { display: block; }
.tile .bar i { display: block; }
.mrow .mid > span { display: block; }
.mrow .l1 { display: flex; }
.mrow { color: var(--ink); font: inherit; }
.mrow:hover { background: var(--row-hover); }
.stat, .next, .chip, .seg button, .tile, .mrow, .btn, .mini { touch-action: manipulation; }
a.mini { text-decoration: none; }
@media (hover: none) { .tile:hover { transform: none; box-shadow: none; } tbody tr:hover, .mrow:hover { background: none; } }

/* ---------- Nuestros viajes (Pedro y Cristina) ---------- */

<div id="app"><div style="min-height:100vh;display:grid;place-items:center;background:#0A1E30;color:#C9973A;font:600 18px system-ui">Abriendo el panel…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
(function () {
"use strict";
// Panel del organizador. Los viajes llegan cifrados en data/panel/<id>.json (los genera tools/build_panel.py
// en cada build a partir de data/trips/*.json). La app guarda la clave al escribir el código del panel.
const AGENCY = "Anillo Travel";
const APP = new URL("../../", location.href).href;
const store = {
  get(k, d) { try { const v = localStorage.getItem("va:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("va:" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("va:" + k); } catch (e) {} },
};
function exit() { ["code", "pk", "pid"].forEach(store.del); location.replace("../../index.html"); }
const PK = store.get("pk", null), PID = store.get("pid", null);
if (!PK || !PID || !/^[0-9a-f]{32}$/.test(PID)) { exit(); return; }

let DATA = { trips: [], built: "" };
const S = { mode: store.get("panel:mode", "clients"), who: store.get("panel:who", "juntos"), view: store.get("panel:view", "list"), q: "", status: "all", type: "all", when: "all", from: "", to: "", sort: store.get("panel:sort", { k: "start", dir: 1 }), open: null };
let seen = store.get("panel:seen", null);

// ---------- Fechas (hora de España) ----------
const todayISO = () => { try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Madrid", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); } catch (e) { return new Date().toISOString().slice(0, 10); } };
const d0 = iso => Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7) - 1, +iso.slice(8, 10));
const days = (a, b) => Math.round((d0(b) - d0(a)) / 864e5);
const addDays = (iso, n) => new Date(d0(iso) + n * 864e5).toISOString().slice(0, 10);
const M = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fd = (iso, y = true) => `${+iso.slice(8, 10)} ${M[+iso.slice(5, 7) - 1]}${y ? " " + iso.slice(0, 4) : ""}`;
const fRange = (a, b) => a.slice(0, 4) === b.slice(0, 4) ? `${fd(a, false)} – ${fd(b)}` : `${fd(a)} – ${fd(b)}`;

function info(t) {
  const T = todayISO(), len = days(t.start, t.end) + 1;
  let st, label, pct = 0;
  // El día de salida: «Sale hoy» hasta la hora del primer vuelo; después ya está en curso.
  const notYet = T === t.start && t.depAt && Date.now() < t.depAt;
  if (T < t.start || notYet) { const n = days(T, t.start); st = "prox"; label = n === 0 ? "Sale hoy" : n === 1 ? "Sale mañana" : `Sale en ${n} días`; }
  else if (T <= t.end) { const n = days(t.start, T) + 1; st = "curso"; label = `En curso · día ${n} de ${len}`; pct = Math.round(n / len * 100); }
  else { st = "fin"; label = "Terminado"; pct = 100; }
  const expires = t.forever ? null : addDays(t.last || t.end, 1); // el código se bloquea a las 00:00 del día siguiente a la vuelta
  const expIn = expires ? days(T, expires) : null;
  return { st, label, pct, len, nights: len - 1, expires, expIn, isNew: !!seen && !seen.includes(t.code) };
}
// Saludo según la hora del móvil: días hasta las 14:00, tardes hasta las 21:00, noches el resto.
const greet = () => { const h = new Date().getHours(); return (h >= 6 && h < 14 ? "Buenos días" : h >= 14 && h < 21 ? "Buenas tardes" : "Buenas noches") + ", Pedro"; };
const hello = () => { const el = document.getElementById("hello"); if (el && el.textContent !== greet()) el.textContent = greet(); };
setInterval(hello, 30000);
["visibilitychange", "pageshow", "focus"].forEach(ev => (ev === "visibilitychange" ? document : window).addEventListener(ev, hello));
const ST = { prox: "Próximo", curso: "En curso", fin: "Terminado" };
const link = t => `${APP}?codigo=${t.code}`;
const img = t => "../../" + t.img;
const first = s => String(s || "").split(" ")[0];
const waText = t => `Hola ${first(t.client)}, aquí tienes tu viaje "${t.title}" en la app de ${AGENCY}.\n\nCódigo: ${t.code}\nEnlace: ${link(t)}\n\nGuárdalo en la pantalla de inicio del móvil para tenerlo siempre a mano.`;
const waURL = t => "https://wa.me/?text=" + encodeURIComponent(waText(t));
// Comprador: quién compró el viaje y su teléfono (solo están en la lista cifrada).
const hasApp = t => t.type !== "FLY"; // los FLY ya no tienen app: solo se siguen desde aquí
const telDigits = p => { let d = String(p || "").replace(/[^\d+]/g, ""); if (d.startsWith("00")) d = "+" + d.slice(2); if (!d.startsWith("+") && d.length === 9) d = "+34" + d; return d; };
const telURL = p => "tel:" + telDigits(p);
const waBuyerURL = t => "https://wa.me/" + telDigits(t.buyerPhone).replace("+", "") + "?text=" + encodeURIComponent(`Hola${t.buyer ? " " + first(t.buyer) : ""}, te escribimos de ${AGENCY} por tu viaje "${t.title}".`);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "") => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const norm = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const all = () => DATA.trips;
const find = code => all().find(t => t.code === code);
// Los viajes de Pedro y Cristina solo salen en «Nuestros viajes», no en Clientes.
const famCodes = () => new Set(["juntos", "pedro", "cristina"].flatMap(k => (DATA.family || {})[k] || []));
// Los viajes subidos que aún esperan el OK no salen en la lista: van arriba, en «Subidos por ti».
const clients = () => { const f = famCodes(); return all().filter(t => !f.has(t.code) && !t.review); };

function whenRange() {
  const T = todayISO(), y = T.slice(0, 4), m = T.slice(0, 7);
  switch (S.when) {
    case "week": return [T, addDays(T, 7)];
    case "month": return [m + "-01", new Date(Date.UTC(+y, +T.slice(5, 7), 0)).toISOString().slice(0, 10)];
    case "3m": return [T, addDays(T, 92)];
    case "year": return [y + "-01-01", y + "-12-31"];
    case "custom": return [S.from || "0000-01-01", S.to || "9999-12-31"];
    default: return null;
  }
}
function list() {
  const q = norm(S.q.trim()), r = whenRange();
  const out = clients().filter(t => {
    const i = info(t);
    if (S.status !== "all" && (S.status === "new" ? !i.isNew : i.st !== S.status)) return false;
    if (S.type !== "all" && t.type !== S.type) return false;
    if (r && (t.end < r[0] || t.start > r[1])) return false; // el viaje se solapa con el periodo
    if (q && !norm([t.code, t.client, t.group, t.title, t.dest, t.buyer, t.buyerPhone, telDigits(t.buyerPhone), t.loc, t.airline].join(" ")).includes(q)) return false;
    return true;
  });
  const k = S.sort.k, dir = S.sort.dir;
  const val = t => k === "exp" ? (t.forever ? "9999" : addDays(t.last || t.end, 1)) : k === "status" ? ({ curso: 0, prox: 1, fin: 2 }[info(t).st] + t.start) : String(t[k] || "");
  out.sort((a, b) => val(a).localeCompare(val(b), "es") * dir || a.code.localeCompare(b.code));
  return out;
}

// ---------- Pintar ----------
const app = document.getElementById("app");
function renderPanel() {
  if (S.mode === "fam") return renderFam();
  const items = clients(), infos = items.map(info);
  const c = { curso: 0, prox: 0, fin: 0, new: 0 }; infos.forEach(i => { c[i.st]++; if (i.isNew) c.new++; });
  const rank = t => { const i = info(t); return i.st === "curso" ? "0" + t.end : "1" + t.start; };
  const nextT = items.filter((t, k) => infos[k].st !== "fin").sort((a, b) => rank(a).localeCompare(rank(b)))[0];
  const newOnes = items.filter((t, k) => infos[k].isNew);
  const rows = list();
  const statBtn = (k, label, color) => `<button class="stat" type="button" data-status="${k}" aria-pressed="${S.status === k}"><b class="num">${c[k]}</b><span><i class="dot" style="background:${color}"></i>${label}</span></button>`;
  const filtered = S.q || S.status !== "all" || S.type !== "all" || S.when !== "all";
  app.innerHTML = `
  ${header()}
  <section class="hero"><div class="wrap">
    <div><h1 id="hello">${greet()}</h1><div class="sub">${items.length} ${items.length === 1 ? "viaje" : "viajes"} en el panel · hoy ${fd(todayISO())}</div></div>
    <div class="mode" role="group" aria-label="Qué ver">
      <button type="button" data-mode="clients" aria-pressed="${S.mode === "clients"}">${ic("users")} Clientes</button>
      <button type="button" data-mode="fam" aria-pressed="${S.mode === "fam"}">${ic("heart")} Nuestros viajes</button>
    </div>
    ${newOnes.length ? `<div class="newbar"><span class="tag new">NUEVO</span><span class="nt">${newOnes.length === 1 ? `Hay un código nuevo: <span class="mono">${newOnes[0].code}</span> (${esc(newOnes[0].client.split(" ").slice(0, 2).join(" "))})` : `Hay ${newOnes.length} códigos nuevos desde tu última visita`}</span><button type="button" id="seeNew">Ver</button></div>` : ""}
    <div class="stats">
      ${statBtn("curso", "En curso", "var(--ok)")}${statBtn("prox", "Próximos", "var(--sea)")}${statBtn("fin", "Terminados", "#98AAB7")}${statBtn("new", "Nuevos", "var(--accent)")}
    </div>
    ${nextT ? `<button class="next" type="button" data-open="${nextT.code}">${ic(nextT.type === "FLY" ? "plane" : "bag")}<div><div class="k">${info(nextT).st === "curso" ? "Ahora de viaje" : "Próxima salida"}</div><div class="t">${esc(nextT.title)}</div><div class="m">${esc(nextT.client)} · ${info(nextT).label.toLowerCase()} · ${fd(info(nextT).st === "curso" ? nextT.end : nextT.start)}</div></div>${ic("chev", "go")}</button>` : ""}
  </div></section>
  <div class="tools"><div class="wrap">
    <div class="row1">
      <label class="search">${ic("search")}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="Buscar cliente, código o destino" value="${esc(S.q)}" aria-label="Buscar"></label>
      <div class="seg" role="group" aria-label="Vista">
        <button type="button" data-view="list" aria-pressed="${S.view === "list"}" title="Lista">${ic("list")}<span class="lbl">Lista</span></button>
        <button type="button" data-view="grid" aria-pressed="${S.view === "grid"}" title="Cuadrados">${ic("grid")}<span class="lbl">Cuadrados</span></button>
      </div>
    </div>
    <div class="chips" role="toolbar" aria-label="Filtros">
      <span class="chip">${ic("cal")}<select id="when" aria-label="Fecha del viaje">
        ${[["all", "Cualquier fecha"], ["week", "Próximos 7 días"], ["month", "Este mes"], ["3m", "Próximos 3 meses"], ["year", "Este año"], ["custom", "Elegir fechas…"]].map(([v, l]) => `<option value="${v}" ${S.when === v ? "selected" : ""}>${l}</option>`).join("")}
      </select></span>
      <span class="chip sep">Tipo</span>
      ${[["all", "Todos"], ["ANI", "Viaje completo"], ["FLY", "Solo vuelos"]].map(([v, l]) => `<button type="button" class="chip" data-type="${v}" aria-pressed="${S.type === v}">${l}</button>`).join("")}
      <span class="chip sep">Orden</span>
      <span class="chip"><select id="sort" aria-label="Ordenar por">
        ${[["start:1", "Salida más cercana"], ["start:-1", "Salida más lejana"], ["client:1", "Cliente A–Z"], ["buyer:1", "Comprador A–Z"], ["code:1", "Código"], ["exp:1", "Caduca antes"], ["status:1", "Estado"]].map(([v, l]) => `<option value="${v}" ${S.sort.k + ":" + S.sort.dir === v ? "selected" : ""}>${l}</option>`).join("")}
      </select></span>
    </div>
    ${S.when === "custom" ? `<div class="range"><span class="muted">Viajes entre</span><input type="date" id="from" value="${S.from}" aria-label="Desde"><span class="muted">y</span><input type="date" id="to" value="${S.to}" aria-label="Hasta"></div>` : ""}
    <div class="count"><span>${rows.length === items.length ? `${rows.length} ${rows.length === 1 ? "viaje" : "viajes"}` : `${rows.length} de ${items.length} viajes`}</span>${filtered ? `<button type="button" class="clear" id="clear">Quitar filtros</button>` : ""}</div>
  </div></div>
  <main class="wrap">${rows.length ? (S.view === "grid" ? grid(rows) : table(rows)) : `<div class="empty"><b>${items.length ? "Ningún viaje con estos filtros" : "Todavía no hay viajes con código"}</b><span>${items.length ? "Prueba con otra fecha o quita los filtros." : "Cuando se cree un código nuevo aparecerá aquí."}</span>${items.length ? `<button type="button" class="btn" id="clear2">Quitar filtros</button>` : ""}</div>`}</main>`;
  bind();
  addPending();
}

// ---------- Nuestros viajes: los de Pedro, los de Cristina y los que hacen juntos ----------
const WHO = [["juntos", "Juntos", "P·C"], ["pedro", "Pedro", "P"], ["cristina", "Cristina", "C"]];
const famTrips = k => ((DATA.family || {})[k] || []).map(find).filter(Boolean).sort((a, b) => b.start.localeCompare(a.start));

// ---------- Mapamundi: países de Pedro, de Cristina y de los dos. España (donde viven) va siempre en amarillo y no cuenta. ----------
let WORLD = null;
const WORLD_N = 195; // países del mundo (miembros de la ONU + 2 observadores)
const TREASURE = `<svg class="treasure" viewBox="0 0 32 32" aria-hidden="true"><path d="M3 8.5 11 5l10 3.5L29 5v18.5L21 27l-10-3.5L3 27z" fill="#EAD19C" stroke="#8A5A2B" stroke-width="1.4" stroke-linejoin="round"/><path d="M11 5v18.5L21 27V8.5z" fill="#D9B978"/><path d="M6.5 21c2-1 2.5-4 5-4.5s3.8 2 6.2.4c1.6-1.1 2-3.6 3.6-5" fill="none" stroke="#8A5A2B" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="1.6 2.1"/><path d="m22 8.6 3.6 3.6M25.6 8.6 22 12.2" stroke="#D2392B" stroke-width="2" stroke-linecap="round"/></svg>`;
async function worldMap() {
  const box = document.createElement("div");
  box.className = "world"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Nuestro mapa del mundo");
  document.body.appendChild(box); document.body.style.overflow = "hidden";
  const close = () => { box.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", esc_); };
  const esc_ = e => { if (e.key === "Escape") { const a = box.querySelector(".wadd, .wfull"); if (a) a.remove(); else close(); } };
  document.addEventListener("keydown", esc_);
  box.innerHTML = `<div class="wh"><div class="wrap"><div><h2>Nuestro mapa del mundo</h2><div class="sub">Cargando el mapa…</div></div><button class="icon-btn" type="button" data-x aria-label="Cerrar">${ic("x")}</button></div></div>`;
  box.querySelector("[data-x]").onclick = close;
  try { if (!WORLD) WORLD = await (await fetch("../maps/mundo.json")).json(); }
  catch (e) { box.querySelector(".sub").textContent = "No se ha podido cargar el mapa. Revisa la conexión."; return; }
  const C = (DATA.family || {}).countries || { pedro: [], cristina: [], home: "ES" };
  const home = C.home || "ES", P0 = new Set(C.pedro || []), C0 = new Set(C.cristina || []);
  const codes = Object.keys(WORLD.c);
  const nm = k => (WORLD.c[k] || {}).n || k;
  const sorted = codes.filter(k => k !== home).sort((a, b) => nm(a).localeCompare(nm(b), "es"));
  const col = { b: "var(--w-both)", p: "var(--w-pedro)", c: "var(--w-cris)" };
  // Países que marcan ellos a mano (se guardan en este móvil): { ISO: "p" | "c" | "b" }
  let man = store.get("panel:paises", {}) || {};
  const hasP = k => P0.has(k) || man[k] === "p" || man[k] === "b";
  const hasC = k => C0.has(k) || man[k] === "c" || man[k] === "b";
  const kind = k => k === home ? "h" : hasP(k) && hasC(k) ? "b" : hasP(k) ? "p" : hasC(k) ? "c" : "";
  const setKind = (k, t) => {
    // Lo que viene de un viaje con la app no se puede quitar: solo se puede ampliar.
    const wantP = t === "p" || t === "b", wantC = t === "c" || t === "b";
    const mp = wantP && !P0.has(k), mc = wantC && !C0.has(k);
    const m = mp && mc ? "b" : mp ? "p" : mc ? "c" : "";
    if (m) man[k] = m; else delete man[k];
    store.set("panel:paises", man);
  };
  const choices = k => {
    const cur = kind(k);
    const ok = t => (!P0.has(k) || t === "p" || t === "b") && (!C0.has(k) || t === "c" || t === "b");
    return `<div class="pick" role="group" aria-label="¿Quién ha estado en ${esc(nm(k))}?">${[["p", "Pedro"], ["c", "Cristina"], ["b", "Los dos"], ["", "Nadie"]].map(([t, l]) => `<button type="button" data-k="${k}" data-t="${t}" aria-pressed="${cur === t}" ${ok(t) ? "" : "disabled"}>${t ? `<i style="background:${col[t]}"></i>` : ""}${l}</button>`).join("")}</div>`;
  };
  let z = 1;
  function paint() {
    const by = { b: [], p: [], c: [] };
    sorted.forEach(k => { const t = kind(k); if (t) by[t].push(k); });
    const visited = by.b.length + by.p.length + by.c.length;
    const pct = (visited / WORLD_N * 100).toFixed(1).replace(".", ",").replace(",0", "");
    box.querySelector(".sub").textContent = `${visited} ${visited === 1 ? "país visitado" : "países visitados"} · el ${pct} % del mundo`;
    box.querySelectorAll("#ms path").forEach(el => { el.setAttribute("class", kind(el.dataset.c)); });
    box.querySelector(".wbar").innerHTML = ["b", "p", "c"].map(t => by[t].length ? `<i style="width:${by[t].length / WORLD_N * 100}%;background:${col[t]}"></i>` : "").join("");
    box.querySelector(".legend").innerHTML = `
      <div><i style="background:var(--w-pedro)"></i>Pedro<b>${by.p.length}</b></div>
      <div><i style="background:var(--w-cris)"></i>Cristina<b>${by.c.length}</b></div>
      <div><i style="background:var(--w-both)"></i>Los dos<b>${by.b.length}</b></div>
      <div><i style="background:var(--w-none)"></i>Sin visitar<b>${WORLD_N - visited}</b></div>`;
    box.querySelector(".clist").innerHTML = visited ? ["b", "p", "c"].flatMap(t => by[t].map(k => `<span><i style="background:${col[t]}"></i>${esc(nm(k))}</span>`)).join("") : `<span class="muted">Todavía no hay países marcados.</span>`;
  }
  box.innerHTML = `<div class="wh"><div class="wrap"><div><h2>Nuestro mapa del mundo</h2><div class="sub"></div></div><button class="icon-btn" type="button" data-x aria-label="Cerrar">${ic("x")}</button></div></div>
  <div class="body"><div class="wrap">
    <div class="mapbox">
      <div class="mapscroll" id="ms"><svg viewBox="0 0 ${WORLD.w} ${WORLD.h}" role="img" aria-label="Mapamundi con los países visitados">${codes.map(k => `<path d="${WORLD.c[k].d}" data-c="${k}"><title>${esc(nm(k))}</title></path>`).join("")}</svg></div>
      <div class="zoom"><button type="button" data-z="1" aria-label="Acercar">${ic("plus")}</button><button type="button" data-z="-1" aria-label="Alejar">${ic("minus")}</button></div>
    </div>
    <div class="btns"><button type="button" class="btn primary" id="add">${ic("plus")} Añadir países</button><button type="button" class="btn" id="big">${ic("expand")} En grande</button></div>
    <div class="wbar" aria-hidden="true"></div>
    <div class="legend"></div>
    <div class="section-k">Países visitados</div>
    <div class="clist"></div>
    <p class="whint">Los países que añadáis se guardan en este móvil. Los de los viajes con la app salen solos.</p>
  </div></div>`;
  box.querySelector("[data-x]").onclick = close;
  const ms = box.querySelector("#ms"), svg = ms.querySelector("svg");
  paint();
  box.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
    const nz = Math.max(1, Math.min(6, z * (+b.dataset.z > 0 ? 1.6 : 1 / 1.6)));
    const cx = (ms.scrollLeft + ms.clientWidth / 2) / ms.scrollWidth, cy = (ms.scrollTop + ms.clientHeight / 2) / ms.scrollHeight;
    z = nz; svg.style.width = (z * 100) + "%";
    ms.style.height = z > 1 ? Math.min(ms.clientWidth * WORLD.h / WORLD.w * 1.35, window.innerHeight * .6) + "px" : "";
    ms.scrollLeft = cx * ms.scrollWidth - ms.clientWidth / 2; ms.scrollTop = cy * ms.scrollHeight - ms.clientHeight / 2;
  });
  // Añadir países: buscador con todos los países y quién ha estado en cada uno.
  box.querySelector("#add").onclick = () => {
    const sh = document.createElement("div"); sh.className = "wadd";
    sh.innerHTML = `<div class="wa-in"><div class="wa-h"><h2>Añadir países</h2><button class="icon-btn" type="button" data-cl aria-label="Cerrar">${ic("x")}</button></div>
      <label class="search">${ic("search")}<input type="search" placeholder="Buscar país" aria-label="Buscar país" autocomplete="off"></label>
      <div class="wa-list"></div>
      <button type="button" class="btn primary" data-cl>Listo</button></div>`;
    box.appendChild(sh);
    const list = sh.querySelector(".wa-list"), q = sh.querySelector("input");
    const draw = () => {
      const f = norm(q.value.trim());
      const rows = sorted.filter(k => !f || norm(nm(k)).includes(f));
      list.innerHTML = rows.length ? rows.map(k => `<div class="wa-row"><b>${esc(nm(k))}</b>${choices(k)}</div>`).join("") : `<div class="muted" style="padding:16px 4px">No hay ningún país con ese nombre.</div>`;
      list.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { const y = list.scrollTop; setKind(b.dataset.k, b.dataset.t); draw(); list.scrollTop = y; paint(); });
    };
    q.addEventListener("input", draw); draw();
    sh.querySelectorAll("[data-cl]").forEach(b => b.onclick = () => sh.remove());
  };
  // En grande: el mapa ocupa toda la pantalla en horizontal (en vertical se gira para que quepa a lo largo).
  box.querySelector("#big").onclick = () => {
    const fs = document.createElement("div"); fs.className = "wfull";
    fs.innerHTML = `<div class="wf-in"><div class="mapscroll">${svg.outerHTML.replace(/ style="[^"]*"/, "")}</div>
      <div class="wf-leg">${[["p", "Pedro"], ["c", "Cristina"], ["b", "Los dos"]].map(([t, l]) => `<span><i style="background:${col[t]}"></i>${l}</span>`).join("")}</div>
      <button class="icon-btn" type="button" aria-label="Cerrar">${ic("x")}</button></div>`;
    box.appendChild(fs); fs.querySelector("button").onclick = () => fs.remove();
  };
}

function expTxt(i) { return i.expires ? `<span class="${i.expIn >= 0 && i.expIn <= 7 ? "exp-soon" : ""}">${i.expIn <= 0 ? "Caducó el " + fd(i.expires) : fd(i.expires)}</span>` : `<span class="muted">No caduca</span>`; }

      <td>${esc(t.dest)}</td>

// Vuelos del billete. La vuelta empieza en el primer vuelo que sale más de 2 días después del anterior.
function flights(t) {
  const f = t.flights || []; if (!f.length) return "";
  const back = f.findIndex((x, k) => k > 0 && x.date > addDays(f[k - 1].date, 2));
  const row = x => `<div class="fl"><span class="d">${fd(x.date, false)}</span><span class="r">${esc(x.from)} ${esc(x.dep)} → ${esc(x.to)} ${esc(x.arr)}${x.plus ? ` <small>(+${x.plus})</small>` : ""}</span><span class="n">${esc(x.no)} · ${esc(x.airline)}</span></div>`;
  const ida = back > 0 ? f.slice(0, back) : f, vuelta = back > 0 ? f.slice(back) : [];
  return `<div class="flights"><h3>${f.length === 1 ? "Vuelo" : "Vuelos"}</h3>${vuelta.length ? `<div class="fl-sep">Ida</div>` : ""}${ida.map(row).join("")}${vuelta.length ? `<div class="fl-sep">Vuelta</div>${vuelta.map(row).join("")}` : ""}</div>`;
}

let lastFocus = null, scrollY0 = 0;

}

// ---------- Subir viajes desde el panel ----------
// Los archivos van a una carpeta de Google Drive (pieza de Apps Script, tools/subidas/Code.gs). Claude la revisa cada hora:
// crea el viaje «por revisar», y cuando el organizador da el OK lo activa. Solo sale si el panel trae DATA.upload.
const UPL = () => DATA.upload && DATA.upload.url && DATA.upload.key ? DATA.upload : null;
let REMOTE = [];      // lo que la carpeta de Drive tiene todavía sin procesar
let REMOTE_AT = 0;
const UP = { kind: "ANI", buyer: "", phone: "", start: "", end: "", pax: "", notes: "", files: [], id: null, sent: 0, busy: false, done: false, err: "" };
const ADD = { code: null, files: [], notes: "", id: null, sent: 0, busy: false, done: false, err: "" };
const MAX_MB = 25;
const NEED = {
  ANI: [["Billetes de avión, tren o barco", true], ["Bonos o reservas de cada hotel", true], ["Itinerario día a día (vale el PDF del proveedor)", true],
    ["Traslados: horas y punto de recogida", false], ["Excursiones y actividades contratadas", false], ["Qué incluye y qué no", false], ["Contacto en destino (guía o agencia local)", false]],
  FLY: [["Billete o localizador de ida y vuelta", true]],

const OKI = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17 19 7"/></svg>`;

const kb = n => n > 1048576 ? (n / 1048576).toFixed(1).replace(".", ",") + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const extOf = f => { const e = (f.name.split(".").pop() || "").toLowerCase(); return { e: e.slice(0, 4), c: e === "pdf" ? "pdf" : /^(jpe?g|png|heic|heif|webp|gif)$/.test(e) ? "img" : /^(docx?|txt|odt|rtf)$/.test(e) ? "doc" : "" }; };
const hhmm = iso => { try { const d = new Date(iso); return d.toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Madrid" }); } catch (e) { return ""; } };
const nArch = n => `${n} ${n === 1 ? "archivo" : "archivos"}`;
const NET = "No se ha podido enviar. Comprueba la conexión a internet y vuelve a intentarlo.";

async function api(body) {
  const u = UPL(); if (!u) throw new Error("off");
  // Cuerpo en texto plano: así el navegador no hace la consulta previa (CORS) que Google no contesta.
  const r = await fetch(u.url, { method: "POST", body: JSON.stringify(Object.assign({}, body, { key: u.key })) });
  const j = await r.json();
  if (!j || !j.ok) throw new Error((j && j.error) || "error");
  return j;
}
async function loadRemote() {
  if (!UPL()) return;
  try { const j = await api({ action: "status" }); REMOTE = Array.isArray(j.items) ? j.items : []; REMOTE_AT = Date.now(); } catch (e) {}
}
const b64file = f => new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = () => ko(r.error); r.readAsDataURL(f); });
// Sube los archivos que falten de uno en uno (si se corta internet, al reintentar sigue por donde iba).
async function sendFiles(st, onStep) {
  for (let i = st.sent; i < st.files.length; i++) {
    onStep(i);
    const f = st.files[i];
    await api({ action: "file", id: st.id, name: f.name, type: f.type || "", b64: await b64file(f) });
    st.sent = i + 1;
  }
  onStep(st.files.length);
}

function dropZone(st) {
  return `<label class="drop" id="u-drop" tabindex="0"><span class="big">${UPI}</span><b>Arrastra aquí los archivos</b><span>Billetes, bonos, itinerario… Valen fotos hechas con el móvil.</span><span class="btn">Elegir archivos</span>

function bindDrop(root, st, repaint) {
  const drop = root.querySelector("#u-drop"), inp = root.querySelector("#u-file");
  const add = list => {
    const big = [];
    Array.from(list).forEach(f => { if (f.size > MAX_MB * 1048576) big.push(f.name); else if (!st.files.some(g => g.name === f.name && g.size === f.size)) st.files.push(f); });
    st.err = big.length ? `${big.length === 1 ? "Este archivo es demasiado grande" : "Estos archivos son demasiado grandes"} (máximo ${MAX_MB} MB): ${big.join(", ")}` : "";
    repaint();
  };
  inp.onchange = () => { add(inp.files); inp.value = ""; };
  drop.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); inp.click(); } });
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { if (e.dataTransfer && e.dataTransfer.files.length) add(e.dataTransfer.files); });

const appLink = t => `../../index.html?codigo=${encodeURIComponent(t.code)}&revisar=1`;
function checksOf(t) {

  if (a.start || a.end) out.push([(!a.start || a.start === t.start) && (!a.end || a.end === t.end), `Fechas: ${fRange(t.start, t.end)} <span class="muted">· ${(!a.start || a.start === t.start) && (!a.end || a.end === t.end) ? "coinciden con lo que pusiste" : `pusiste ${a.start && a.end ? fRange(a.start, a.end) : fd(a.start || a.end)}`}</span>`]);
  else out.push([true, `Fechas leídas de los billetes: ${fRange(t.start, t.end)}`]);
  if (t.pax) out.push([!a.pax || +a.pax === t.pax, `${t.pax} ${t.pax === 1 ? "viajero" : "viajeros"} <span class="muted">· ${!a.pax ? "leídos de los billetes" : +a.pax === t.pax ? "coincide con lo que pusiste" : `pusiste ${a.pax}`}</span>`]);
  out.push([!miss.length, miss.length ? `Falta: ${miss.map(esc).join(" · ")}` : "No falta nada"]);
  return out;
}
function openReview(code) {
  const t = find(code); if (!t) return;
  const fly = t.type === "FLY";
  const b = modal("Revisar el viaje", `Revisar el viaje de ${esc(t.buyer || t.client)}`, fly ? "Mira que los datos del vuelo estén bien y da el OK." : "Así lo verá el cliente. Mira que todo esté bien y da el OK. Hasta entonces el código no funciona.");
  const paint = mode => {
    const miss = t.missing || [];
    const left = fly ? `<dl class="facts rev-fly">
        <div><dt>Cliente</dt><dd>${esc(t.client) || "—"}</dd></div><div><dt>Destino</dt><dd>${esc(t.dest) || "—"}</dd></div>
        <div><dt>Fechas</dt><dd class="num">${fRange(t.start, t.end)}</dd></div>${t.loc ? `<div><dt>Localizador</dt><dd class="mono">${esc(t.loc)}</dd></div>` : ""}
        ${t.airline ? `<div><dt>Aerolínea</dt><dd>${esc(t.airline)}</dd></div>` : ""}</dl>${flights(t)}`
      : `<div class="mockphone" aria-label="Vista previa de la app"><iframe src="${appLink(t)}" title="App del cliente" loading="lazy"></iframe></div>`;
    b.innerHTML = `<div class="rev ${fly ? "fly" : ""}">
      ${left}
      <div class="rev-side">
        <div class="bigcode"><div><div class="l">${fly ? "Código del vuelo" : "Código del cliente"}</div><div class="mono">${t.code}</div></div><span class="pill review">Sin activar</span></div>
        <ul class="checks">${checksOf(t).map(([ok, tx]) => `<li class="${ok ? "ok" : "no"}"><span>${ok ? OKI : "!"}</span><span>${tx}</span></li>`).join("")}</ul>
        ${fly ? "" : `<a class="btn" href="${appLink(t)}" target="_blank" rel="noopener">${EYE} Abrir la app completa</a>`}
      </div></div>
      ${mode === "fix" ? `<div class="step"><h3>¿Qué hay que cambiar?</h3>
        <label class="fld" style="font-weight:500"><span class="sr">Qué hay que cambiar</span><textarea id="r-fix" maxlength="4000" placeholder="Ej.: el hotel de Marrakech es el Riad Yasmine, no el Riad Kniza; la excursión al Atlas es el día 4…"></textarea></label>
        ${ADD.err ? `<div class="warnbox"><span>⚠️</span><span>${esc(ADD.err)}</span></div>` : ""}
        <div class="btns"><button type="button" class="btn" id="r-back">Cancelar</button><button type="button" class="btn primary" id="r-sendfix" disabled>Enviar corrección</button></div></div>`
      : `<div class="send">
        ${ADD.err ? `<div class="warnbox"><span>⚠️</span><span>${esc(ADD.err)}</span></div>` : ""}
        ${miss.length ? `<div class="warnbox"><span>⚠️</span><span>Puedes dar el OK aunque falte algo: ${fly ? "se queda apuntado" : "en la app saldrá como <b>«Pendiente»</b>"} y lo podrás subir después.</span></div>` : ""}
        <button type="button" class="btn ok-btn" id="r-ok">${OKI} Está bien, dar el OK</button>
        <div class="btns"><button type="button" class="btn" id="r-fixbtn">Algo está mal</button><button type="button" class="btn" id="r-add">${UPI} ${miss.length ? "Subir lo que falta" : "Añadir archivos"}</button></div></div>`}`;
    const q = s => b.querySelector(s);
    if (mode === "fix") {
      const ta = q("#r-fix"); ta.oninput = () => { q("#r-sendfix").disabled = !ta.value.trim(); };
      q("#r-back").onclick = () => { ADD.err = ""; paint(); };
      q("#r-sendfix").onclick = async () => {
        if (ADD.busy) return; ADD.busy = true; q("#r-sendfix").disabled = true; q("#r-sendfix").textContent = "Enviando…";
        try { await api({ action: "fix", code: t.code, notes: ta.value.trim() }); ADD.busy = false; ADD.err = ""; await loadRemote(); closeUpload(); toast("Corrección enviada"); }
        catch (e) { ADD.busy = false; ADD.err = NET; const v = ta.value; paint("fix"); q("#r-fix").value = v; q("#r-sendfix").disabled = !v.trim(); }
      };
      return;
    }
    q("#r-fixbtn").onclick = () => { ADD.err = ""; paint("fix"); };
    q("#r-add").onclick = () => openAdd(t.code);
    q("#r-ok").onclick = async () => {
      if (ADD.busy) return; ADD.busy = true; q("#r-ok").disabled = true; q("#r-ok").innerHTML = "Enviando…";
      try {
        await api({ action: "ok", code: t.code }); ADD.busy = false; ADD.err = ""; loadRemote().then(() => { if (!S.up) renderPanel(); });
        b.innerHTML = `<div class="done"><span class="ok">${OKI}</span><h3>¡OK recibido!</h3>
          <p>En menos de una hora ${fly ? "el vuelo pasa a tu lista" : `el código <b class="mono">${t.code}</b> empieza a funcionar y el viaje pasa a tu lista`}. Te avisará la tarjeta de arriba${fly ? "" : ", y desde ahí ya se lo podrás mandar por WhatsApp"}.</p>
          <div class="btns"><button type="button" class="btn primary full" data-closeup>Volver al panel</button></div></div>`;
      } catch (e) { ADD.busy = false; ADD.err = NET; paint(); }
    };
  };
  ADD.err = ""; paint();
}

// ---------- 3) Añadir archivos o cambios a un viaje que ya existe ----------
function openAdd(code) {
  const t = find(code); if (!t || !UPL()) return;
  Object.assign(ADD, { code, files: [], notes: "", id: null, sent: 0, busy: false, done: false, err: "" });
  const miss = t.missing || [];
  const b = modal("Añadir al viaje", "Añadir archivos o cambios", `${esc(t.buyer || t.client)} · <span class="mono">${t.code}</span>. ${t.type === "FLY" ? "" : "El cliente verá los cambios solo, sin hacer nada."}`);
  const can = () => ADD.files.length || ADD.notes.trim();
  const paint = () => {
    if (ADD.done) return;
    b.innerHTML = `${miss.length ? `<div class="need warn"><b>Falta en este viaje:</b><ul>${miss.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
      <div class="step"><h3><i>1</i>Archivos nuevos <small>· opcional</small></h3>${dropZone(ADD)}</div>
      <div class="step"><h3><i>2</i>¿Qué ha cambiado? <small>· opcional</small></h3>
        <label class="fld" style="font-weight:500"><span class="sr">Qué ha cambiado</span><textarea id="a-notes" maxlength="4000" placeholder="Ej.: el vuelo de vuelta ahora sale a las 18:40; la recogida es a las 07:30 en el hotel…">${esc(ADD.notes)}</textarea></label></div>
      ${ADD.err ? `<div class="warnbox"><span>⚠️</span><span>${esc(ADD.err)}</span></div>` : ""}
      <div class="send"><button type="button" class="btn primary" id="a-send" ${can() ? "" : "disabled"}>${UPI} Enviar cambios</button>
        <small>Se actualiza en menos de una hora (de 9:00 a 21:00). Si cambia algo importante, te llega para revisarlo otra vez.</small></div>`;
    bindDrop(b, ADD, paint);
    b.querySelector("#a-notes").oninput = e => { ADD.notes = e.target.value; b.querySelector("#a-send").disabled = !can(); };
    b.querySelector("#a-send").onclick = async () => {
      if (!can() || ADD.busy) return;
      ADD.busy = true; ADD.err = "";
      const total = ADD.files.length;
      const step = i => { b.innerHTML = progressHTML("Enviando cambios…", total ? `${i < total ? `Archivo ${i + 1} de ${total}` : "Terminando"}. No cierres esta ventana.` : "Un momento…", total ? Math.round((i / total) * 100) : 60); };
      step(ADD.sent);
      try {
        if (!ADD.id) ADD.id = (await api({ action: "change", code, notes: ADD.notes.trim() })).id;
        await sendFiles(ADD, step);
        ADD.done = true; ADD.busy = false;
        loadRemote().then(() => { if (!S.up) renderPanel(); });
        b.innerHTML = `<div class="done"><span class="ok">${OKI}</span><h3>¡Recibido!</h3><p>En menos de una hora el viaje se actualiza. Lo verás arriba, en «Subidos por ti».</p>
          <div class="btns"><button type="button" class="btn primary full" data-closeup>Volver al panel</button></div></div>`;
      } catch (e) { ADD.busy = false; ADD.err = NET; paint(); }
    };
  };
  paint();
}

// ---------- Tarjetas de arriba: «Subidos por ti» ----------
function pendingCards() {
  if (!UPL()) return [];
  const byCode = (type, code) => REMOTE.find(r => r.type === type && r.code === code);
  const hidden = store.get("panel:hideMiss", {});
  const cards = [];
  REMOTE.filter(r => r.type === "new").sort((a, b) => String(b.at).localeCompare(String(a.at))).forEach(r => cards.push({ k: "wait", who: r.buyer, kind: r.kind, tx: `Creándose… · ${nArch(r.files || 0)} · enviado el ${hhmm(r.at)}` }));
  all().filter(t => t.review).forEach(t => {
    const who = t.buyer || t.client, kind = t.type;
    if (byCode("ok", t.code)) cards.push({ k: "wait", who, kind, code: t.code, tx: `Activándose… · ${t.code} · en menos de una hora ${t.type === "FLY" ? "pasa a tu lista" : "el código funciona"}` });
    else if (byCode("fix", t.code)) cards.push({ k: "wait", who, kind, code: t.code, tx: `Corrigiéndose… · ${t.code} · enviado el ${hhmm(byCode("fix", t.code).at)}` });
    else if (byCode("change", t.code)) cards.push({ k: "wait", who, kind, code: t.code, tx: `Actualizándose… · ${t.code}` });
    else cards.push({ k: "review", who, kind, code: t.code, miss: t.missing || [] });
  });
  REMOTE.filter(r => r.type === "change").forEach(r => { const t = find(r.code); if (t && !t.review) cards.push({ k: "wait", who: t.buyer || t.client, kind: t.type, code: t.code, tx: `Actualizándose… · ${t.code} · enviado el ${hhmm(r.at)}` }); });
  all().filter(t => !t.review && (t.missing || []).length && hidden[t.code] !== t.missing.join("|") && !byCode("change", t.code))
    .forEach(t => cards.push({ k: "miss", who: t.buyer || t.client, kind: t.type, code: t.code, miss: t.missing }));
  return cards;
}
function cardHTML(c) {
  const kind = c.kind === "FLY" ? "Solo vuelo" : "Viaje completo";
  if (c.k === "wait") return `<div class="pcard"><span class="spin" aria-hidden="true"></span><div class="tx"><b>${esc(c.who)} · ${kind}</b><span>${esc(c.tx)}</span></div></div>`;
  if (c.k === "review") return `<div class="pcard review"><span class="spin" aria-hidden="true">${EYE}</span>
      <div class="tx"><b>${esc(c.who)} · ${kind}</b><span>Listo para revisar · código <span class="code">${c.code}</span> sin activar</span>
        ${c.miss.length ? `<span class="miss">Falta: ${c.miss.map(esc).join(" · ")}</span>` : ""}</div>
      <div class="acts"><button type="button" class="btn primary" data-rev="${c.code}">${EYE} Revisar y dar el OK</button></div></div>`;
  return `<div class="pcard warn"><span class="spin" aria-hidden="true">!</span>
      <div class="tx"><b>${esc(c.who)} · <span class="code">${c.code}</span></b><span class="miss">Falta: ${c.miss.map(esc).join(" · ")}</span>${c.kind === "FLY" ? "" : "<span>En la app sale como «Pendiente».</span>"}</div>
      <div class="acts"><button type="button" class="btn primary" data-add="${c.code}">${UPI} Subir lo que falta</button><button type="button" class="btn" data-hidemiss="${c.code}" aria-label="Quitar aviso">${ic("x")}</button></div></div>`;
}
function addPending() {
  if (S.mode === "fam") return;
  const cards = pendingCards(); if (!cards.length) return;
  const main = app.querySelector("main"); if (!main) return;
  const box = document.createElement("section"); box.className = "pending"; box.setAttribute("aria-label", "Subidos por ti");
  box.innerHTML = `<h2>Subidos por ti</h2>` + cards.map(cardHTML).join("");
  main.prepend(box);
  box.querySelectorAll("[data-rev]").forEach(s => s.onclick = () => openReview(s.dataset.rev));
  box.querySelectorAll("[data-add]").forEach(s => s.onclick = () => openAdd(s.dataset.add));
  box.querySelectorAll("[data-hidemiss]").forEach(s => s.onclick = () => { const t = find(s.dataset.hidemiss); const h = store.get("panel:hideMiss", {}); if (t) h[t.code] = (t.missing || []).join("|"); store.set("panel:hideMiss", h); renderPanel(); });
}
// En la ficha de cada viaje: lo que falta y el botón «Añadir archivos o cambios».
function addToSheet(code) {
  const t = find(code), inn = document.querySelector("#scrim .sheet .in"); if (!t || !inn || !UPL()) return;
  const miss = t.missing || [];
  const box = document.createElement("div"); box.className = "addbox";
  box.innerHTML = `${miss.length ? `<div class="need warn"><b>Falta en este viaje:</b><ul>${miss.map(m => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
    <button type="button" class="btn full ${miss.length ? "primary" : ""}" data-add="${code}">${UPI} ${miss.length ? "Subir lo que falta" : "Añadir archivos o cambios"}</button>`;
  const notes = inn.querySelector(".note"); inn.insertBefore(box, notes || null);
  box.querySelector("[data-add]").onclick = () => openAdd(code);
}

// ---------- Cargar y descifrar ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = s => new Uint8Array(s.match(/../g).map(h => parseInt(h, 16)));
async function load() {
  const r = await fetch(`../panel/${PID}.json`, { cache: "no-cache" });
  if (r.status === 404) throw Object.assign(new Error("gone"), { gone: true });
  if (!r.ok) throw new Error("http " + r.status);
  const box = await r.json();
  const key = await crypto.subtle.importKey("raw", hex(PK), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.iv) }, key, b64(box.ct));
  const d = JSON.parse(new TextDecoder().decode(plain));
  d.trips = (d.trips || []).filter(t => t && t.code && /^\d{4}-\d\d-\d\d$/.test(t.start) && /^\d{4}-\d\d-\d\d$/.test(t.end));
  return d;
}
async function refresh(first) {
  try {
    const d = await load();
    const sig = JSON.stringify(d.trips) + JSON.stringify(d.upload);
    // Lo que está subiendo el organizador (carpeta de Drive): se pide aparte y no frena la carga del panel.
    const remote = () => { if (d.upload) loadRemote().then(() => { if (!S.open && !S.up) refreshList(); }); };
    if (!first && sig === JSON.stringify(DATA.trips) + JSON.stringify(DATA.upload)) { remote(); return; }
    DATA = d; remote();
    if (!seen) { seen = d.trips.filter(t => !t.review).map(t => t.code); store.set("panel:seen", seen); } // primera vez: nada sale como nuevo
    if (S.open && find(S.open)) sheet(S.open); else { if (S.open) closeSheet(); else renderPanel(); }
  } catch (e) {
    if (e.gone || e.name === "OperationError") { exit(); return; } // código del panel cambiado o retirado
    if (first) app.innerHTML = `<div class="wrap" style="padding-block:60px;display:grid;gap:14px;max-width:520px"><h1 style="font-size:28px">No se ha podido abrir el panel</h1><p class="muted" style="margin:0">Comprueba la conexión a internet y vuelve a intentarlo.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn primary" id="retry">Reintentar</button><button type="button" class="btn" id="out2">Salir</button></div></div>`,
      document.getElementById("retry").onclick = () => location.reload(), document.getElementById("out2").onclick = exit;
  }
}
if (!window.crypto || !crypto.subtle) { app.innerHTML = `<div class="wrap" style="padding-block:60px">Este navegador no puede abrir el panel. Actualízalo o prueba con otro.</div>`; return; }
refresh(true);
// Al volver a la app y cada 10 minutos, mira si hay viajes nuevos.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { refresh(false); if (!S.open) renderPanel(); } });
setInterval(() => refresh(false), 600000);
// Mientras haya algo subiéndose o por activar, se mira cada 2 minutos si ya está listo.
setInterval(() => { if (document.visibilityState === "visible" && REMOTE.length) refresh(false); }, 120000);
// Actualización de la app (igual que en las otras páginas).
if ("serviceWorker" in navigator) {
  const had = !!navigator.serviceWorker.controller; let rl = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !rl && !S.open) { rl = true; location.reload(); } });
  const chk = () => navigator.serviceWorker.getRegistration("../../").then(r => { if (r) r.update().catch(() => {}); }).catch(() => {});
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") chk(); });
  setInterval(chk, 1800000);
}
})();
</script>
