<style>
/* Layout: one phone-width column; full-bleed photo heroes; fixed bottom nav with 5 tabs. Brand colors come from data/agency.json. */
:root {
  --bg: #F2F5F7;
  --surface: #FFFFFF;
  --surface-2: #E8EEF2;
  --ink: #0E2233;
  --muted: #586A78;
  --line: #D8E1E7;
  --brand: #0B3B5C;
  --brand-ink: #0B3B5C;
  --brand-deep: #0A1E30;
  --accent: #C9973A;
  --accent-ink: #8A6216;
  --sea: #14898F;
  --sea-soft: #DCEFEF;
  --map-sea: #C6E4E7;
  --map-land: #E6ECEF;
  --map-tr: #FFFFFF;
  --warn-soft: #FBF1DC;
  --danger: #C2412D;
  --ok: #2E8B57;
  --on-brand: #FFFFFF;
  --shadow: 0 1px 2px rgba(14,34,51,.06), 0 8px 24px rgba(14,34,51,.08);
  --font-display: "Marcellus", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 20px;
  --nav-h: 74px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07121B; --surface: #0E1D2A; --surface-2: #142838; --ink: #EAF1F5; --muted: #98AAB7; --line: #1E3344;
    --brand-ink: #9CCBEA; --accent: #E0B35A; --accent-ink: #E8C27A; --sea: #44C2C7; --sea-soft: #10303A; --warn-soft: #2B2414; --map-sea: #0B2731; --map-land: #132636; --map-tr: #1C3A50;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07121B; --surface: #0E1D2A; --surface-2: #142838; --ink: #EAF1F5; --muted: #98AAB7; --line: #1E3344;
  --brand-ink: #9CCBEA; --accent: #E0B35A; --accent-ink: #E8C27A; --sea: #44C2C7; --sea-soft: #10303A; --warn-soft: #2B2414; --map-sea: #0B2731; --map-land: #132636; --map-tr: #1C3A50;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 17px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; }
a { color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; letter-spacing: .01em; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.ic { width: 24px; height: 24px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.fill { fill: currentColor; stroke: none; }

.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.view { padding-bottom: calc(var(--nav-h) + 28px + env(safe-area-inset-bottom, 0px)); min-height: 100vh; animation: viewIn .35s ease both; }
@keyframes viewIn { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Splash / login ---------- */
.login { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--brand-deep); color: #fff; position: relative; overflow: hidden; }
.login-photo { position: relative; flex: 1 0 auto; height: 46vh; min-height: 270px; background-size: cover; background-position: center 70%; transform: scale(1.04); animation: kenburns 18s ease-in-out infinite alternate; }
@keyframes kenburns { to { transform: scale(1.12) translateY(-1.5%); } }
.login-photo::after { content: ""; position: absolute; inset: -1px; background: radial-gradient(ellipse 75% 50% at 50% 22%, rgba(6,26,43,.72), rgba(6,26,43,0) 72%), linear-gradient(180deg, rgba(6,26,43,.6) 0%, rgba(6,26,43,.3) 40%, rgba(6,26,43,0) 60%, var(--brand-deep) 100%); }
.login-top { position: absolute; left: 0; right: 0; top: 0; z-index: 2; padding-top: calc(calc(env(safe-area-inset-top, 0px) + 16px) + 56px); }
.login-card { position: relative; z-index: 1; margin-top: -40px; width: 100%; padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; }
.login-card h1 { font-size: 34px; line-height: 1.12; }
.login-card p { margin: 0; color: rgba(255,255,255,.82); }
.code-field { display: grid; gap: 8px; }
.code-field label { font-size: 15px; font-weight: 600; color: rgba(255,255,255,.9); }
.code-input { width: 100%; height: 64px; border-radius: 16px; border: 2px solid rgba(255,255,255,.28); background: rgba(255,255,255,.1); color: #fff; font: 600 26px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .14em; text-align: center; text-transform: uppercase; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.code-input::placeholder { color: rgba(255,255,255,.4); }
.code-input:focus { outline: none; border-color: var(--accent); background: rgba(255,255,255,.16); }
.login-error { min-height: 1.4em; color: #FFC9BD; font-weight: 600; font-size: 15px; }
.demo-link { justify-self: center; background: none; border: 0; color: rgba(255,255,255,.85); font-size: 15px; padding: 8px 12px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.demo-link b { font-family: ui-monospace, Menlo, monospace; letter-spacing: .06em; }

/* ---------- Logo ---------- */
.logo { display: inline-flex; align-items: center; gap: 10px; color: inherit; }
.logo svg { width: 40px; height: 40px; flex: none; }
.logo .wm { display: grid; line-height: 1; }
.logo .wm b { font: 400 25px/1 var(--font-display); letter-spacing: .02em; }
.logo .wm small { font-size: 10px; font-weight: 700; letter-spacing: .42em; margin-top: 4px; opacity: .85; }
.logo img { height: 44px; width: auto; }
.logo.sm svg { width: 32px; height: 32px; }
.logo.svg svg { width: auto; height: 44px; }
.logo.svg.sm svg { width: auto; height: 36px; }
.logo.stacked { display: block; }
.logo.stacked svg { width: 210px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 2px 10px rgba(0,0,0,.35)); }
.foot .logo.svg svg { height: 34px; color: var(--brand-ink); }
.logo.sm .wm b { font-size: 20px; }
.logo.sm .wm small { font-size: 8.5px; }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; padding: 0 22px; border-radius: 16px; border: 0; font-weight: 700; font-size: 18px; text-decoration: none; cursor: pointer; transition: transform .12s ease, filter .12s ease; }
.btn:active { transform: scale(.98); filter: brightness(.95); }
.btn-primary { background: var(--accent); color: #1A1204; }
.btn-brand { background: var(--brand); color: var(--on-brand); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-wa { background: #1FA855; color: #fff; }
.btn-block { width: 100%; }
.btn-sm { min-height: 46px; font-size: 16px; padding: 0 16px; border-radius: 13px; }
.btn .ic { width: 22px; height: 22px; }
.icon-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 0; cursor: pointer; background: var(--surface); color: var(--brand-ink); box-shadow: var(--shadow); }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: calc(env(safe-area-inset-top, 0px) + 14px) 6px; }
.topbar.on-photo { position: absolute; left: 0; right: 0; top: 0; z-index: 2; color: #fff; }
.topbar.on-photo .icon-btn { background: rgba(255,255,255,.18); color: #fff; box-shadow: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.page-title { padding-block: 6px 14px; display: grid; gap: 2px; }
.page-title h1 { font-size: 32px; line-height: 1.1; }

/* ---------- Home hero ---------- */
.hero { position: relative; color: #fff; background: var(--brand-deep); overflow: hidden; }
.hero-photo { position: absolute; inset: 0; background-size: cover; background-position: center 60%; }
.hero-photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,30,48,.55), rgba(10,30,48,.05) 35%, rgba(10,30,48,.25) 60%, rgba(10,30,48,.9)); }
.hero-inner { position: relative; padding-top: calc(calc(env(safe-area-inset-top, 0px) + 14px) + 78px); padding-bottom: 54px; display: grid; gap: 6px; }
.hero h1 { font-size: 40px; line-height: 1.05; }
.hero .greet { font-size: 18px; font-weight: 600; opacity: .95; }
.hero .dates { font-size: 16px; opacity: .9; }
.hero .dates .ic { width: 20px; height: 20px; vertical-align: -4px; margin-right: 4px; }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 14px; font-weight: 600; margin-top: 8px; }
.route span.stop { background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 99px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.route .sep { opacity: .7; }
.balloon { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: calc(calc(env(safe-area-inset-top, 0px) + 14px) + 64px); width: 62px; opacity: .95; animation: float 7s ease-in-out infinite; pointer-events: none; }
@keyframes float { 50% { transform: translateY(-12px) rotate(2deg); } }

.stack { display: grid; gap: 14px; }
.stack > *, .places > *, .quick > * { min-width: 0; }
.lift { margin-top: -34px; position: relative; z-index: 1; }
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.card h2 { font-size: 24px; line-height: 1.15; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; margin-bottom: 10px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 22px 2px 10px; }
.section-title h2 { font-size: 25px; }
.section-title button { background: none; border: 0; color: var(--brand-ink); font-weight: 700; font-size: 15px; cursor: pointer; padding: 6px; }

/* Countdown */
.countdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.countdown div { background: var(--surface-2); border-radius: 14px; padding: 10px 4px; text-align: center; }
.countdown b { display: block; font: 400 34px/1 var(--font-display); color: var(--brand-ink); }
.countdown small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 5px 10px; border-radius: 99px; background: var(--sea-soft); color: var(--sea); }
.pill.gold { background: var(--warn-soft); color: var(--accent-ink); }
.pill.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .25; } }

/* Quick actions */
.quick { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.qa { display: grid; gap: 10px; align-content: start; text-align: left; padding: 16px; min-height: 112px; border-radius: var(--r); border: 0; background: var(--surface); box-shadow: var(--shadow); cursor: pointer; text-decoration: none; }
.qa .qi { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--sea-soft); color: var(--sea); }
.qa b { font-size: 17px; line-height: 1.2; }
.qa small { display: block; color: var(--muted); font-size: 14px; font-weight: 500; margin-top: 2px; }
.qa.wa .qi { background: #DDF5E6; color: #128C44; }
.qa.gold .qi { background: var(--warn-soft); color: var(--accent-ink); }
.qa.brand .qi { background: var(--surface-2); color: var(--brand-ink); }

/* Day strip (home) */
.strip { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.dcard { flex: 0 0 74%; max-width: 300px; scroll-snap-align: start; border-radius: var(--r); overflow: hidden; position: relative; aspect-ratio: 4 / 3.2; color: #fff; border: 0; padding: 0; cursor: pointer; text-align: left; background: var(--brand-deep); }
.dcard .ph { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .5s ease; }
.dcard:active .ph { transform: scale(1.04); }
.dcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 35%, rgba(5,18,30,.85)); }
.dcard .tx { position: absolute; left: 14px; right: 14px; bottom: 12px; z-index: 1; display: grid; gap: 2px; }
.dcard .tx small { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.dcard .tx b { font: 400 23px/1.1 var(--font-display); }
.dcard .badge { position: absolute; top: 12px; left: 12px; z-index: 1; background: var(--accent); color: #1A1204; font-weight: 800; font-size: 12px; letter-spacing: .1em; padding: 4px 9px; border-radius: 99px; }

/* Progress bar */
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--sea), var(--accent)); border-radius: inherit; transition: width .4s ease; }

/* Preview banner */
.sim-banner { position: fixed; left: 0; right: 0; top: 0; z-index: 30; display: flex; justify-content: center; padding-top: env(safe-area-inset-top, 0px); pointer-events: none; }
.sim-banner div { pointer-events: auto; margin-top: 8px; background: var(--accent); color: #1A1204; font-weight: 700; font-size: 14px; border-radius: 99px; padding: 8px 8px 8px 14px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow); }
.review-banner div { background: #14898F; color: #fff; padding: 8px 14px; }
#simBanner:not(:empty) + .review-banner { display: none; }
.sim-banner button { border: 0; background: rgba(0,0,0,.14); border-radius: 99px; padding: 6px 12px; font-weight: 700; cursor: pointer; }

/* ---------- Itinerary ---------- */
.daytabs { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.daytabs .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.daytabs .wrap::-webkit-scrollbar { display: none; }
.dchip { flex: none; display: grid; justify-items: center; gap: 0; min-width: 64px; padding: 8px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; }
.dchip small { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.dchip b { font: 400 24px/1.1 var(--font-display); }
.dchip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.dchip.on small { color: rgba(255,255,255,.8); }
.dchip.today { border-color: var(--accent); }

.day { scroll-margin-top: 96px; margin-top: 18px; }
.day-hero { position: relative; border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; color: #fff; background: var(--brand-deep); }
.day-hero .ph { position: absolute; inset: 0; background-size: cover; background-position: center; }
.day-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(5,18,30,.88)); }
.day-hero .tx { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; display: grid; gap: 2px; }
.day-hero .tx small { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .92; }
.day-hero .tx h2 { font-size: 30px; line-height: 1.08; }
.day-hero .tx span { font-size: 15px; opacity: .9; }
.day-hero .badge { position: absolute; top: 12px; left: 12px; z-index: 1; background: var(--accent); color: #1A1204; font-weight: 800; font-size: 12px; letter-spacing: .1em; padding: 5px 10px; border-radius: 99px; }

.tip { display: flex; gap: 12px; align-items: flex-start; background: var(--warn-soft); color: var(--ink); border-radius: 16px; padding: 14px; margin-top: 12px; font-size: 16px; }
.tip .ic { color: var(--accent-ink); margin-top: 1px; }

.timeline { position: relative; margin-top: 14px; display: grid; gap: 14px; }
.timeline::before { content: ""; position: absolute; left: 23px; top: 26px; bottom: 26px; width: 2px; background: repeating-linear-gradient(180deg, var(--line) 0 6px, transparent 6px 11px); }
.tl { display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: start; }
.tl-dot { width: 48px; height: 48px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--sea); position: relative; z-index: 1; }
.tl-body { min-width: 0; background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 16px; display: grid; gap: 8px; }
.tl-body .part { font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-ink); }
.tl-body h3 { font-size: 22px; line-height: 1.15; }
.tl-body p { margin: 0; }
.tl-body ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px; }
.tl-body li { position: relative; padding-left: 18px; }
.tl-body li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; border-radius: 50%; background: var(--sea); }

.place-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface-2); border: 0; border-radius: 14px; padding: 10px 12px; cursor: pointer; min-height: 56px; }
.place-row .pn { flex: 1; min-width: 0; }
.place-row .pn b { display: block; font-size: 16.5px; line-height: 1.25; }
.place-row .pn small { color: var(--muted); font-size: 14px; }
.place-row .ic { color: var(--muted); width: 20px; height: 20px; }
.place-row .pin { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); color: var(--sea); flex: none; }
.place-row .pin .ic { color: var(--sea); }
.places { display: grid; gap: 8px; }

.stay-row { display: flex; align-items: center; gap: 12px; margin-top: 12px; padding: 12px 14px; border-radius: 16px; border: 2px dashed var(--line); width: 100%; background: transparent; text-align: left; cursor: pointer; }
.stay-row .ic { color: var(--brand-ink); }
.stay-row b { display: block; }
.stay-row small { color: var(--muted); }

/* ---------- Boarding pass ---------- */
.pass { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.pass-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--brand); color: #fff; }
.pass-top b { font-size: 15px; letter-spacing: .04em; }
.pass-top span { font-size: 14px; opacity: .9; }
.pass-main { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 16px; }
.pass-main .end { min-width: 0; }
.pass-main .end.r { text-align: right; }
.pass-main .iata { font: 400 38px/1 var(--font-display); letter-spacing: .04em; color: var(--brand-ink); }
.pass-main .city { font-weight: 600; font-size: 15px; }
.pass-main .time { font-size: 22px; font-weight: 800; }
.pass-main .mid { display: grid; justify-items: center; gap: 4px; color: var(--muted); font-size: 13px; font-weight: 600; }
.pass-main .mid .ic { color: var(--accent); width: 28px; height: 28px; }
.pass-main .mid .line { width: 64px; height: 2px; background: repeating-linear-gradient(90deg, var(--line) 0 5px, transparent 5px 9px); }
.pass-foot { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 16px 14px; border-top: 2px dashed var(--line); position: relative; font-size: 14px; }
.pass-foot::before, .pass-foot::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); }
.pass-foot::before { left: -10px; } .pass-foot::after { right: -10px; }
.pass-foot div { display: grid; }
.pass-foot small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pass-foot b { font-size: 16px; }
.pass-foot .pend { color: var(--accent-ink); font-weight: 700; }
.pass.mini { box-shadow: none; background: var(--surface-2); }
.pass.mini .pass-main { padding: 12px; }
.pass.mini .pass-main .iata { font-size: 30px; }
.pass.mini .pass-main .time { font-size: 19px; }

/* Hotel card */
.hotel { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.hotel .ph { aspect-ratio: 16 / 8; max-width: 100%; background-size: cover; background-position: center; position: relative; }
.hotel .ph .pill { position: absolute; left: 12px; top: 12px; background: rgba(255,255,255,.92); color: #0E2233; }
.hotel .bd { padding: 16px; display: grid; gap: 10px; }
.hotel h3 { font-size: 24px; line-height: 1.15; }
.stars { color: var(--accent); letter-spacing: 2px; font-size: 15px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; }
.kv small { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv b { font-size: 16px; }
.addr { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; }
.addr .ic { color: var(--sea); margin-top: 2px; }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.note { font-size: 15px; color: var(--accent-ink); background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; }

/* Lists */
.list { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 68px; border: 0; width: 100%; background: none; text-align: left; text-decoration: none; cursor: pointer; }
.li + .li { border-top: 1px solid var(--line); }
.li .lic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand-ink); flex: none; }
.li .lt { flex: 1; min-width: 0; }
.li .lt b { display: block; font-size: 17px; line-height: 1.25; }
.li .lt small { color: var(--muted); font-size: 14.5px; }
.li .chev { color: var(--muted); width: 20px; height: 20px; }
.li .tag { font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent-ink); background: var(--warn-soft); padding: 4px 8px; border-radius: 8px; flex: none; }
.li.check { cursor: pointer; }
.li.check .box { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--line); display: grid; place-items: center; flex: none; color: transparent; transition: background .15s; }
.li.check.done .box { background: var(--ok); border-color: var(--ok); color: #fff; }
.li.check.done .lt b { text-decoration: line-through; color: var(--muted); }

/* Segmented jump chips */
.seg { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); }
.seg .wrap { display: flex; gap: 8px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
.seg .wrap::-webkit-scrollbar { display: none; }
.seg button { flex: none; border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 10px 16px; font-weight: 700; font-size: 15.5px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.seg button .ic { width: 19px; height: 19px; color: var(--sea); }
.anchor { scroll-margin-top: 80px; }

/* ---------- Map ---------- */
.map-card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; position: relative; }
.map-svg { display: block; width: 100%; height: auto; background: var(--map-sea); touch-action: manipulation; }
.map-svg .sea { fill: var(--map-sea); }
.map-svg .land { fill: var(--map-land); stroke: var(--map-sea); stroke-width: 1.2; }
.map-svg .tr { fill: var(--map-tr); stroke: var(--sea); stroke-width: 1.8; }
.map-svg .rt { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; animation: dash 1.6s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -22; } }
.map-svg .pin circle.halo { fill: var(--brand); opacity: .18; transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
@keyframes halo { from { transform: scale(.6); opacity: .35; } to { transform: scale(1.8); opacity: 0; } }
.map-svg .pin circle.dot { fill: var(--sea); stroke: #fff; stroke-width: 3.5; }
.map-svg .pin.on circle.dot { fill: var(--accent); }
.map-svg .pin text { font: 400 30px var(--font-display); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 6px; stroke-linejoin: round; }
.map-svg .pin text.sub { font: 700 17px var(--font-body); fill: var(--muted); letter-spacing: .04em; }
.map-svg .pin { cursor: pointer; }
.map-svg .sea-label { font: italic 400 20px var(--font-display); fill: var(--sea); opacity: .8; letter-spacing: .3em; }
.map-svg .from text { font: 700 17px var(--font-body); fill: var(--muted); }
.map-hint { position: absolute; right: 10px; bottom: 10px; background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted); box-shadow: var(--shadow); }
.city-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.city-tab { position: relative; border: 0; padding: 0; border-radius: 18px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; color: #fff; cursor: pointer; text-align: left; background: var(--brand-deep); outline: 3px solid transparent; outline-offset: 2px; transition: outline-color .2s; }
.city-tab.on { outline-color: var(--accent); }
.city-tab .ph { position: absolute; inset: 0; background-size: cover; background-position: center; }
.city-tab::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(5,18,30,.55) 50%, rgba(5,18,30,.9)); }
.city-tab span { position: absolute; left: 12px; bottom: 10px; z-index: 1; display: grid; }
.city-tab b { font: 400 22px/1.1 var(--font-display); }
.city-tab small { font-size: 13px; font-weight: 600; opacity: .9; }

/* ---------- Info ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile .ti { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sea-soft); color: var(--sea); }
.tile small { font-size: 12.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile .big { font: 400 30px/1.05 var(--font-display); color: var(--brand-ink); }
.tile p { margin: 0; font-size: 15px; color: var(--muted); }
.tile.wide { grid-column: 1 / -1; }
.clocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.clocks div { display: grid; }
.clocks b { font: 400 34px/1 var(--font-display); color: var(--brand-ink); }
.clocks span { font-size: 14px; color: var(--muted); font-weight: 600; }
.wx { display: grid; gap: 10px; }
.wx-row { display: flex; align-items: center; gap: 12px; }
.wx-row .t { font: 400 26px/1 var(--font-display); color: var(--brand-ink); min-width: 84px; flex: none; }
.wx-row .c { font-weight: 700; }
.wx-row p { margin: 0; font-size: 14.5px; color: var(--muted); }

.phrase { display: flex; align-items: center; gap: 12px; padding: 12px 14px 12px 16px; min-height: 72px; }
.phrase + .phrase { border-top: 1px solid var(--line); }
.phrase .pt { flex: 1; min-width: 0; display: grid; }
.phrase .pt small { color: var(--muted); font-size: 14px; }
.phrase .pt b { font-size: 20px; line-height: 1.25; color: var(--brand-ink); }
.phrase .pt i { font-style: normal; font-size: 14px; color: var(--accent-ink); font-weight: 600; letter-spacing: .02em; }
.speak { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--sea-soft); color: var(--sea); display: grid; place-items: center; cursor: pointer; flex: none; }
.speak.on { background: var(--sea); color: #fff; }

.sos { display: flex; align-items: center; gap: 14px; background: var(--danger); color: #fff; border-radius: var(--r); padding: 16px 18px; text-decoration: none; box-shadow: var(--shadow); }
.sos b { font: 400 44px/1 var(--font-display); }
.sos span { display: grid; font-weight: 600; }
.sos small { opacity: .9; font-weight: 500; }

/* Agency card */
.agent { display: grid; gap: 14px; }
.agent-top { display: flex; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, var(--brand), var(--sea)); color: #fff; display: grid; place-items: center; font: 400 25px/1 var(--font-display); flex: none; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--accent); }
.agent-top b { display: block; font-size: 19px; line-height: 1.2; }
.agent-top small { color: var(--muted); font-size: 15px; }

/* Converter */
.conv { gap: 10px; }
.conv-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface-2); border-radius: 14px; padding: 10px 14px; min-height: 64px; }
.conv-row label, .conv-row span { font-weight: 600; font-size: 15px; color: var(--muted); }
.conv-row input { width: 50%; min-width: 0; border: 0; background: transparent; text-align: right; font: 400 30px/1 var(--font-display); color: var(--ink); }
.conv-row input:focus { outline: none; }
.conv-row.out b { font: 400 30px/1 var(--font-display); color: var(--brand-ink); }
.conv-swap { justify-self: center; width: 44px; height: 44px; margin: -16px 0; position: relative; z-index: 1; border-radius: 50%; border: 3px solid var(--surface); background: var(--accent); color: #1A1204; font-size: 20px; font-weight: 800; cursor: pointer; }
.conv-quick { display: flex; gap: 8px; flex-wrap: wrap; }
.conv-quick button { flex: 1; min-width: 52px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 0; font-weight: 700; cursor: pointer; }
.conv-rate { font-size: 14px; color: var(--muted); }
.conv-rate input { width: 4.2em; border: 2px solid var(--line); border-radius: 8px; padding: 2px 6px; font: 700 14px var(--font-body); color: var(--ink); background: var(--surface); text-align: center; }


/* Top bar actions, text size, language */
.tb-actions { display: flex; gap: 10px; }
.aa { font: 700 17px/1 var(--font-body); letter-spacing: -.02em; }
.aa span { font-size: 23px; }
[data-act="big"][aria-pressed="true"] { background: var(--accent); color: #1A1204; }
.topbar.on-photo [data-act="big"][aria-pressed="true"] { background: var(--accent); color: #1A1204; }
.login-tools { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; display: flex; gap: 8px; align-items: center; }
.login-tools .icon-btn { width: 44px; height: 44px; background: rgba(255,255,255,.18); color: #fff; box-shadow: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
/* Menú de 3 rayas (idioma, letra, modo) */
.menu-wrap { position: relative; }
.menu-btn[aria-expanded="true"] { background: var(--accent) !important; color: #1A1204 !important; }
.menu-panel { position: fixed; z-index: 60; width: min(320px, calc(100vw - 32px)); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 12px 40px rgba(6,18,28,.28); padding: 14px; display: grid; gap: 14px; animation: menuIn .18s ease both; text-align: left; }
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } }
.mp-row { display: grid; gap: 8px; }
.mp-l { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
.mp-l .ic { color: var(--sea); width: 20px; height: 20px; }
.mp-l .aa { color: var(--sea); }
.menu-panel .segbtn { display: grid; grid-template-columns: 1fr 1fr; }
.menu-panel .segbtn button { min-height: 44px; }
.langsw { display: inline-flex; border-radius: 99px; padding: 3px; background: var(--surface-2); }
.langsw.dark { background: rgba(255,255,255,.18); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.langsw button { border: 0; background: none; border-radius: 99px; padding: 8px 12px; font-weight: 800; font-size: 13px; letter-spacing: .06em; cursor: pointer; color: inherit; }
.langsw.dark button { color: #fff; }
.langsw button.on { background: var(--accent); color: #1A1204; }
.settings { display: grid; gap: 14px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.set-row > span { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; }
.set-row > span .ic { color: var(--sea); }
.segbtn { display: inline-flex; background: var(--surface-2); border-radius: 14px; padding: 4px; }
.segbtn button { border: 0; background: none; border-radius: 11px; padding: 10px 14px; font-weight: 700; font-size: 15px; cursor: pointer; color: var(--ink); min-height: 44px; }
.segbtn button.on { background: var(--brand); color: #fff; }

/* Local contact */
.local { display: grid; gap: 10px; margin-top: 12px; }
.local-row { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 14px; }
.local.compact .local-row { box-shadow: none; background: var(--surface-2); }
.local-row .lic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--sea-soft); color: var(--sea); flex: none; }
.local-row .lt { flex: 1; min-width: 0; display: grid; }
.local-row .lt small { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.local-row .lt b { font-size: 16.5px; line-height: 1.25; }
.local-row .lt span { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.local-row .lt b { overflow-wrap: anywhere; }
.local-row .call { flex: none; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: #fff; }

/* My notes */
.mynotes { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.nf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.nf { display: grid; gap: 4px; background: var(--surface-2); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.nf:last-child { grid-column: 1 / -1; }
.nf span { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nf input { width: 100%; min-width: 0; border: 0; background: transparent; font: 600 18px var(--font-body); color: var(--ink); padding: 2px 0; }
.nf input:focus { outline: none; }
.nf:focus-within { outline: 2px solid var(--accent); }
.notes-card { display: grid; gap: 10px; }
.notes-card textarea { width: 100%; min-height: 130px; resize: vertical; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font: 17px/1.5 var(--font-body); color: var(--ink); background: var(--surface-2); }
.notes-card textarea:focus { outline: none; border-color: var(--accent); }
.saved { color: var(--ok); font-weight: 700; }
.section-title > .ic { color: var(--muted); }
.lic.inc { color: var(--ok) !important; background: color-mix(in srgb, var(--ok) 14%, transparent) !important; }
.unbutton { all: unset; cursor: pointer; display: block; border-radius: 18px; }
.unbutton:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Large text: everything inside the screens grows ~18 %. */
html.big .view, html.big .sheet > .wrap, html.big .taxi > .wrap, html.big .login-card { zoom: 1.18; }
html.big .nav button { font-size: 14px; }
html.big .nav button .ic { width: 30px; height: 30px; }
html.big .toast { font-size: 18px; }

/* ---------- Bottom nav ---------- */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.nav button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 4px; font-size: 12.5px; font-weight: 700; color: var(--muted); cursor: pointer; position: relative; }
.nav button .ic { width: 27px; height: 27px; transition: transform .2s; }
.nav button.on { color: var(--brand-ink); }
.nav button.on .ic { transform: translateY(-1px) scale(1.06); }
.nav button.on::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(4,14,22,.5); opacity: 0; transition: opacity .25s; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 88vh; max-height: 88dvh; overflow-y: auto; background: var(--bg); border-radius: 26px 26px 0 0; transform: translateY(100%); transition: transform .32s cubic-bezier(.2,.8,.2,1); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.sheet.open { transform: none; }
.sheet .grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 10px auto 6px; }
.sheet .wrap { display: grid; gap: 14px; padding-top: 6px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.sheet-head h2 { font-size: 28px; line-height: 1.12; }
.close-x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); display: grid; place-items: center; cursor: pointer; flex: none; color: var(--ink); }
.sheet-photo { border-radius: 18px; aspect-ratio: 16 / 9; max-width: 100%; background-size: cover; background-position: center; }

/* Taxi card */
.taxi { position: fixed; inset: 0; z-index: 60; background: #FFFFFF; color: #0E2233; overflow-y: auto; padding-top: calc(env(safe-area-inset-top, 0px) + 16px); padding-bottom: max(20px, env(safe-area-inset-bottom, 0px)); animation: viewIn .25s ease both; }
.taxi .wrap { display: grid; gap: 18px; }
.taxi .phr { font-size: 22px; font-weight: 700; line-height: 1.3; }
.taxi .es { font-size: 16px; color: #586A78; }
.taxi .dest { font: 400 38px/1.12 "Marcellus", Georgia, serif; }
.taxi .addr-big { font-size: 26px; line-height: 1.3; font-weight: 600; border-left: 6px solid #C9973A; padding-left: 14px; }
.taxi .close-x { background: #E8EEF2; color: #0E2233; }
.taxi .flag { display: inline-flex; gap: 8px; align-items: center; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; font-size: 13px; color: #C2412D; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); z-index: 70; background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 14px; font-weight: 600; font-size: 15.5px; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Install card */
.install { display: flex; gap: 14px; align-items: center; }
.install .ii { width: 52px; height: 52px; border-radius: 14px; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; }
.install b { display: block; }
.install small { color: var(--muted); font-size: 14.5px; }

.foot { text-align: center; color: var(--muted); font-size: 13.5px; margin-top: 26px; display: grid; gap: 6px; justify-items: center; }
.foot button { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; cursor: pointer; padding: 8px; }

@media (min-width: 600px) { .hero h1 { font-size: 48px; } .dcard { flex-basis: 46%; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Viaje con página propia (p. ej. crucero): a pantalla completa, sin nada de la plantilla */
html.page-mode, html.page-mode body { height: 100%; overflow: hidden; background: #0a2a43; }
.page-shell { position: fixed; inset: 0; background: linear-gradient(#0a2a43 50%, var(--page-foot, #fff) 50%); }
.page-frame { position: absolute; left: 0; right: 0; top: 0; height: calc(100% - env(safe-area-inset-bottom, 0px)); width: 100%; border: 0; display: block; background: #fff; }
@media (prefers-color-scheme: dark) { .page-shell { --page-foot: #0E1D2A; } }

/* Mapa a país completo: trazos y textos en la escala del mapa ancho */
.map-svg.wide .land { stroke: none; }
.map-svg.wide .tr { stroke-width: 2.6; stroke-linejoin: round; }
.map-svg.wide .rt { stroke-width: 6; stroke-dasharray: 3 14; }
.map-svg.wide .pin text { font-size: 46px; stroke-width: 10px; }
.map-svg.wide .pin text.sub { font-size: 24px; stroke-width: 8px; }
.map-svg.wide .pin circle.dot { stroke-width: 5; }
.map-svg.wide .sea-label { font-size: 26px; letter-spacing: .35em; opacity: .75; }
.map-svg.wide .country-label { font: 400 60px var(--font-display); letter-spacing: .45em; fill: var(--sea); opacity: .16; }
.map-svg.wide .from text { font: 700 26px var(--font-body); fill: var(--muted); paint-order: stroke; stroke: var(--map-sea); stroke-width: 8px; stroke-linejoin: round; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .segbtn button.on { background: var(--accent); color: #1A1204; } }
:root[data-theme="dark"] .segbtn button.on { background: var(--accent); color: #1A1204; }

/* ---------- Safari (viajes con cuaderno de animales) ---------- */
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 6px 11px; border-radius: 99px; background: var(--surface-2); color: var(--ink); }
.chip .ic { color: var(--sea); }
.chip.pend { background: var(--warn-soft); color: var(--accent-ink); }
.chip.pend .ic { color: var(--accent-ink); }
.pack { margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--sea-soft); }

.st-photos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

.st-photos span.on { filter: none; opacity: 1; box-shadow: 0 0 0 2.5px var(--accent); }
.big5-card { display: grid; gap: 10px; }
.animals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

.animal.seen .ph { filter: none; }
.animal:active .ph { transform: scale(1.04); }
.animal::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(5,18,30,.9)); }
.animal .tx { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; display: grid; gap: 1px; }
.animal .tx b { font: 400 22px/1.1 var(--font-display); }
.animal .tx small { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.animal .tx i { font-style: normal; font-size: 13px; margin-top: 4px; color: #F4D592; font-weight: 600; }
.animal .tx i.where { color: rgba(255,255,255,.78); font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.animal .ok { position: absolute; top: 10px; right: 10px; z-index: 1; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.7); color: transparent; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: .2s; }
.animal .ok .ic { width: 20px; height: 20px; stroke-width: 2.6; }
.animal.seen .ok { background: var(--accent); border-color: var(--accent); color: #1A1204; }
.animal.b5::before { content: "★"; position: absolute; top: 12px; left: 12px; z-index: 1; font-size: 13px; color: #1A1204; background: var(--accent); border-radius: 99px; padding: 2px 8px; font-weight: 800; }
.park { position: relative; border: 0; padding: 0; border-radius: var(--r); overflow: hidden; aspect-ratio: 16 / 10; color: #fff; text-align: left; cursor: pointer; background: var(--brand-deep); width: 100%; }
.park .ph { position: absolute; inset: 0; background-size: cover; background-position: center; transition: transform .5s; }
.park:active .ph { transform: scale(1.03); }
.park::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(5,18,30,.55) 55%, rgba(5,18,30,.92)); }

.park .tx { position: absolute; left: 16px; right: 16px; bottom: 14px; z-index: 1; display: grid; gap: 2px; }
.park .tx small { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .9; }
.park .tx b { font: 400 32px/1.05 var(--font-display); }
.park .tx span { font-size: 15px; opacity: .92; }
.li .lic.noinc { background: var(--warn-soft); color: var(--accent-ink); }
.map-svg .lake { fill: var(--map-sea); stroke: var(--sea); stroke-width: 1; stroke-opacity: .4; }

@media (min-width: 720px) { .animals { grid-template-columns: repeat(3, 1fr); } }

  };
  const ic = (n, cls = "", style = "") => n === "wa"
    ? `<svg class="ic fill ${cls}" ${style ? `style="${style}"` : ""} viewBox="0 0 24 24" aria-hidden="true">${P.wa}</svg>`
    : `<svg class="ic ${cls}" ${style ? `style="${style}"` : ""} viewBox="0 0 24 24" aria-hidden="true">${P[n] || P.info}</svg>`;
  const aa = () => `<span class="aa" aria-hidden="true">A<span>A</span></span>`;

  // ---------- estado ----------
  const S = { agencyBase: null, agency: null, tripBase: null, trip: null, map: null, tab: store.get("tab", "home"), sim: null, deferredPrompt: null, timer: null };
  const IS_PWA_BUILD = !!window.__VIAJES_PWA__;
  const now = () => (S.sim != null ? S.sim : Date.now());

  async function getJSON(url) {
    const r = await fetch(url, { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  // ---------- ajustes: idioma y letra ----------
  function applyBig() { document.documentElement.classList.toggle("big", !!store.get("big", false)); }
  function toggleBig() {
    const v = !store.get("big", false); store.set("big", v); applyBig();
    toast(v ? L("Letra grande activada") : L("Letra normal"));
    document.querySelectorAll("[data-act=big]").forEach((b) => b.setAttribute("aria-pressed", v));
    document.querySelectorAll("[data-size]").forEach((b) => b.classList.toggle("on", (b.dataset.size === "big") === v));
  }
  // Modo claro / oscuro: "light" o "dark" si la persona lo elige; si no, sigue al móvil.
  const sysDark = () => { try { return window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return false; } };
  const curTheme = () => { const t = store.get("theme", null); return t === "dark" || t === "light" ? t : (sysDark() ? "dark" : "light"); };
  function applyTheme() {
    const t = store.get("theme", null);
