  }
  function setTheme(t) {
    store.set("theme", t); applyTheme();
    document.querySelectorAll("[data-theme-opt]").forEach((b) => { const on = b.dataset.themeOpt === t; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  }
  // Menú de las 3 rayas: idioma, tamaño de letra y modo claro/oscuro.
  const burger = () => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>`;
  const oneLang = () => !!(S.trip && S.trip.langs && S.trip.langs.length === 1);
  function menuPanelHTML() {
    const big = !!store.get("big", false), th = curTheme();
    const seg = (attr, items, cur) => `<div class="segbtn">${items.map(([v, l]) => `<button type="button" ${attr}="${v}" class="${v === cur ? "on" : ""}" aria-pressed="${v === cur}">${l}</button>`).join("")}</div>`;
    return `<div class="menu-panel" id="menuPanel" role="dialog" aria-label="${L("Menú")}">
      ${oneLang() ? "" : `<div class="mp-row"><span class="mp-l">${ic("globe")} ${L("Idioma")}</span>${seg("data-lang", Object.keys(LANGS).map((k) => [k, LANGS[k]]), LANG)}</div>`}
      <div class="mp-row"><span class="mp-l">${aa()} ${L("Tamaño de letra")}</span>${seg("data-size", [["normal", L("Mediana")], ["big", L("Grande")]], big ? "big" : "normal")}</div>
      <div class="mp-row"><span class="mp-l"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg> ${L("Modo")}</span>${seg("data-theme-opt", [["light", L("Claro")], ["dark", L("Oscuro")]], th)}</div>
    </div>`;
  }
  function menuHTML() {
    return `<div class="menu-wrap"><button class="icon-btn menu-btn" type="button" data-act="menu" aria-expanded="${!!S.menu}" aria-label="${L("Menú")}">${burger()}</button></div>`;
  }
  // El panel va fuera de la pantalla (en <body>) para que ninguna foto ni tarjeta lo tape o lo corte.
  function toggleMenu(open) {
    S.menu = open == null ? !S.menu : open;
    const old = document.getElementById("menuPanel"); if (old) old.remove();
    document.querySelectorAll(".menu-btn").forEach((b) => b.setAttribute("aria-expanded", S.menu));
    if (!S.menu) return;
    const btn = Array.from(document.querySelectorAll(".menu-btn")).find((b) => b.getClientRects().length);
    if (!btn || btn.getBoundingClientRect().bottom < 0) { S.menu = false; document.querySelectorAll(".menu-btn").forEach((b) => b.setAttribute("aria-expanded", false)); return; }
    document.body.insertAdjacentHTML("beforeend", menuPanelHTML());
    const bar = (btn.closest(".tb-actions, .login-tools") || btn).getBoundingClientRect(), r = btn.getBoundingClientRect(), p = document.getElementById("menuPanel");
    p.style.top = Math.round(r.bottom + 10) + "px";
    p.style.right = Math.max(16, Math.round(document.documentElement.clientWidth - bar.right)) + "px";
  }
  function setLang(l) {
    if (!LANGS[l] || l === LANG) return;
    LANG = l; store.set("lang", l);
    document.documentElement.lang = l;
    S.agency = localized(S.agencyBase);
    if (S.tripBase) { S.trip = localized(S.tripBase); const y = window.scrollY; renderApp(); window.scrollTo({ top: y }); }
    else if (S.expired) renderExpired();
    else renderLogin();
    if (S.menu) toggleMenu(true);
  }

  // ---------- marca ----------
  function logo(size = "") {
    const a = S.agency;
    if (size === "stacked" && S.logoStacked) return `<span class="logo stacked">${S.logoStacked}</span>`;
    if (S.logoInline) return `<span class="logo svg ${size}">${S.logoInline}</span>`;
    if (typeof a.logo === "string") return `<span class="logo ${size}"><img src="${esc(a.logo)}" alt="${esc(a.name)}"></span>`;
    return `<span class="logo ${size}"><span class="wm"><b>${esc(a.name)}</b></span></span>`;
  }
  function applyBrand() {
    const c = S.agency.colors || {}, r = document.documentElement.style;
    if (c.brand) r.setProperty("--brand", c.brand);
    if (c.brandDark) r.setProperty("--brand-deep", c.brandDark);
    if (c.accent) r.setProperty("--accent", c.accent);
    document.title = S.agency.name;
  }

  // ---------- arranque ----------
  async function boot() {
    applyBig(); applyTheme();
    document.documentElement.lang = LANG;
    try { S.agencyBase = await getJSON("data/agency.json"); }
    catch (e) { document.getElementById("app").innerHTML = `<div class="wrap" style="padding-block:40px">${L("No se ha podido cargar la app. Comprueba la conexión y vuelve a abrirla.")}</div>`; return; }
    S.agency = localized(S.agencyBase);
    applyBrand();
    const lg = S.agency.logo || {};
    const svgTxt = async (u) => { try { const r = await fetch(u); return r.ok ? (await r.text()).replace(/<\?xml[^>]*>/, "") : null; } catch (e) { return null; } };
    if (lg.inline) S.logoInline = await svgTxt(lg.inline);
    if (lg.stacked) S.logoStacked = await svgTxt(lg.stacked);
    window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); S.deferredPrompt = e; });
    // Un solo listener para toda la app (antes se añadía uno por pestaña y los toques se repetían).
    document.addEventListener("click", onClick);
    window.addEventListener("scroll", () => { if (S.menu) toggleMenu(true); }, { passive: true });
    window.addEventListener("resize", () => { if (S.menu) toggleMenu(true); });
    document.addEventListener("input", onInput);
    // Entrada desde la web de la agencia: ?codigo=ANI-XXXXX abre el viaje directamente.
    let urlCode = null;
    try { urlCode = new URLSearchParams(location.search).get("codigo"); } catch (e) {}
    // ?revisar=1: el organizador abre desde su panel un viaje que todavía no tiene su OK (solo en un móvil u ordenador que ya abrió el panel).
    try { S.preview = new URLSearchParams(location.search).get("revisar") === "1" && !!store.get("pk", null); } catch (e) { S.preview = false; }
    if (urlCode) {
      try { history.replaceState(null, "", location.pathname); } catch (e) {}
      if (await openTrip(urlCode, false)) return;
    }
    const code = store.get("code", null);
    if (code) { const ok = await openTrip(code, true); if (ok) return; }
    renderLogin();
    if (urlCode) {
      const inp = document.getElementById("code"), err = document.getElementById("loginErr");
      if (inp) inp.value = normCode(urlCode);
      if (err) err.textContent = notFoundMsg();
    }
  }

  const notFoundMsg = () => S.notReady ? L("Tu viaje todavía se está preparando. Tu agencia te avisará en cuanto esté listo.") : L("No encontramos ese código. Revísalo o pregúntale a tu agencia.");
  function normCode(v) {
    let s = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (s.length > 3) s = s.slice(0, 3) + "-" + s.slice(3, 8);
    return s;
  }

  async function openTrip(code, silent) {
    code = normCode(code); S.notReady = false;
    if (!/^[A-Z0-9]{3}-[A-Z0-9]{5}$/.test(code)) return false;
    // Los viajes FLY (solo vuelos) ya no tienen app para el cliente: solo se siguen desde el panel del organizador.
    if (code.startsWith("FLY-")) { if (silent) store.del("code"); return false; }
    if (!isDemo(code) && store.get("gone", []).includes(code)) { renderExpired(); return true; }
    try {
      const trip = await getJSON(`data/trips/${code}.json`);
      // Viaje subido desde el panel que el organizador aún no ha revisado: el código todavía no funciona para el cliente.
      if (trip.review && !S.preview) { S.notReady = true; if (silent) store.del("code"); return false; }
      const keep = !(trip.review && S.preview); // la vista previa no cambia el código guardado en este dispositivo
      const lockAt = isDemo(code) || trip.neverExpires ? Infinity : accessEndMs(trip);
      if (Date.now() >= lockAt) { purgeTrip(code, trip); renderExpired(); return true; }
      S.code = code; S.lockAt = lockAt;
      if (trip.page) { S.tripBase = S.trip = trip; S.map = null; if (keep) store.set("code", code); renderPage(); return true; }
      // Un viaje puede ir solo en algunos idiomas (p. ej. solo español): se usa ese idioma sin cambiar la preferencia guardada.
      if (trip.langs && trip.langs.length && !trip.langs.includes(LANG)) { LANG = trip.langs[0]; document.documentElement.lang = LANG; S.agency = localized(S.agencyBase); }
      S.tripBase = trip; S.trip = localized(trip);
      try { S.map = trip.map ? await getJSON(`data/maps/${trip.map}.json`) : null; } catch (e) { S.map = null; }
      if (keep) store.set("code", code);
      S.isPreview = !keep;
      renderApp();
      return true;
    } catch (e) {
      if (await openPanel(code)) return true;
      if (silent) store.del("code");
      return false;
    }
  }

  // ---------- panel del organizador ----------
  // Su código no está en ningún archivo: de él se sacan (PBKDF2) el nombre del archivo cifrado y su clave.
  // Si existe data/panel/<id>.json, se guarda la clave en este móvil y se abre la página del panel.
  const PANEL_ITER = 120000; // igual que ITER en tools/build_panel.py
  async function openPanel(code) {
    try {
      if (!window.crypto || !crypto.subtle || !window.TextEncoder) return false;
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveBits"]);
      const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: new TextEncoder().encode("viajes-app/panel"), iterations: PANEL_ITER }, base, 384));
      const hx = (a) => Array.from(a, (b) => b.toString(16).padStart(2, "0")).join("");
      const pid = hx(bits.slice(0, 16));
      const r = await fetch(`data/panel/${pid}.json`, { cache: "no-cache" });
      if (!r.ok) return false;
      const box = await r.json().catch(() => null); // sin internet, el service worker puede devolver otra cosa
      if (!box || !box.ct || !box.iv) return false;
      store.set("pid", pid); store.set("pk", hx(bits.slice(16)));
      store.set("code", code);
      stopTimer(); closeSheet(true);
      location.replace("data/pages/panel.html");
      return true;
    } catch (e) { return false; }
  }

  // ---------- caducidad del código ----------
  // El código deja de funcionar a las 00:00 del día siguiente a la vuelta (hora de salida),
  // o del día siguiente a "accessUntil" si el viaje lo indica. El código de demo no caduca.
  const isDemo = (code) => !!(S.agencyBase && S.agencyBase.demoCode && normCode(S.agencyBase.demoCode) === code);
  function accessEndMs(trip) {
    const hz = (trip.flights && trip.flights[0] && trip.flights[0].from.tz) || trip.tz || "+01:00";
    const last = trip.accessUntil || trip.end;
    const next = new Date(Date.parse(last + "T12:00:00Z") + 864e5).toISOString().slice(0, 10);
    return at(next, "00:00", hz);
  }
  function purgeTrip(code, trip) {
    // Borra todo lo guardado en el móvil de ese viaje y lo marca como cerrado para siempre.
    const gone = store.get("gone", []); if (!gone.includes(code)) { gone.push(code); store.set("gone", gone); }
    store.del("code"); store.del("tab");
    try { Object.keys(localStorage).forEach((k) => { if ((k.startsWith("va:") && k.includes(code)) || (trip && trip.page && !k.startsWith("va:"))) localStorage.removeItem(k); }); } catch (e) {}
    const files = [`data/trips/${code}.json`].concat(trip && trip.page ? [trip.page] : []).concat(((trip && trip.documents) || []).map((d) => d.file).filter(Boolean));
    try {
      if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.open(k).then((c) => c.keys().then((reqs) => reqs.forEach((r) => { if (files.some((f) => r.url.includes(f))) c.delete(r); })))));
    } catch (e) {}
    S.trip = S.tripBase = S.map = null; S.code = null; S.lockAt = null; S.sim = null;
  }
  function renderExpired() {
    stopTimer(); closeSheet(true); S.expired = true; document.documentElement.classList.remove("page-mode");
    const a = S.agency, c = a.contact || {};
    const wa = String(c.whatsapp || "").replace(/[^0-9]/g, "");
    const msg = encodeURIComponent(L("Quiero preparar mi próximo viaje"));
    document.getElementById("app").innerHTML = `
      <section class="login">
        <div class="login-photo" style="background-image:url('${esc(a.loginImage || "")}')"></div>
        <div class="login-top wrap">${logo("stacked")}</div>
        <div class="login-tools">${menuHTML()}</div>
        <div class="login-card wrap">
          <h1>${L("Este viaje ha terminado")}</h1>
          <p>${L("Por privacidad, los datos de este viaje ya no están disponibles en la app.")}</p>
          <p>${L("Gracias por viajar con {a}. ¿Preparamos el siguiente?", { a: esc(a.name) })}</p>
          ${wa ? `<a class="btn btn-wa btn-block" href="https://wa.me/${wa}?text=${msg}" target="_blank" rel="noopener">${ic("wa")} ${L("WhatsApp con {n}", { n: esc(a.agent.firstName) })}</a>` : ""}
          ${a.reviewUrl ? `<a class="btn btn-primary btn-block" style="margin-top:10px" href="${esc(a.reviewUrl)}" target="_blank" rel="noopener">${ic("star")} ${L("Dejar una reseña")}</a>` : ""}
          <button class="demo-link" type="button" id="otherCode">${L("Introducir otro código")}</button>
        </div>
      </section>`;
    $("#otherCode").addEventListener("click", renderLogin);
  }

  // ---------- viaje con su propia página (p. ej. el crucero) ----------
  // Se abre la página tal cual, a pantalla completa (sin marco, para que respete la zona de la hora y la batería).
  // La propia página comprueba la caducidad y trae el botón de salir.
  function renderPage() {
    stopTimer(); closeSheet(true);
    location.replace(S.trip.page);
  }
  function logout() {
    stopTimer(); document.documentElement.classList.remove("page-mode");
    store.del("code"); S.trip = S.tripBase = S.map = null; S.code = null; S.lockAt = null; S.sim = null;
    renderLogin();
  }

  function langSwitch(onDark) {
    return `<div class="langsw ${onDark ? "dark" : ""}" role="group" aria-label="Idioma / Language">${Object.keys(LANGS).map((k) => `<button type="button" data-lang="${k}" class="${k === LANG ? "on" : ""}" aria-pressed="${k === LANG}">${k.toUpperCase()}</button>`).join("")}</div>`;
  }

  // ---------- login ----------
  function renderLogin() {
    const pref = store.get("lang", "es"); if (LANGS[pref] && pref !== LANG && S.agencyBase) { LANG = pref; document.documentElement.lang = LANG; S.agency = localized(S.agencyBase); }
    stopTimer(); S.expired = false; document.documentElement.classList.remove("page-mode");
    const a = S.agency;
    document.getElementById("app").innerHTML = `
      <section class="login">
        <div class="login-photo" style="background-image:url('${esc(a.loginImage || "")}')"></div>
        <div class="login-top wrap">${logo("stacked")}</div>
        <div class="login-tools">${menuHTML()}</div>
        <form class="login-card wrap" id="loginForm" autocomplete="off" novalidate>
          <h1>${L("Todo tu viaje,<br>en un solo lugar")}</h1>
          <p>${L("Escribe el código de reserva que te ha dado tu agencia.")}</p>
          <div class="code-field">
            <label for="code">${L("Código de reserva")}</label>
            <input class="code-input" id="code" name="code" inputmode="text" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="AAA-XXXXX" aria-describedby="loginErr">
          </div>
          <div class="login-error" id="loginErr" role="alert"></div>
          <button class="btn btn-primary btn-block" type="submit" id="go">${L("Ver mi viaje")} ${ic("chev")}</button>
          ${installCardHTML(true)}
        </form>
      </section>`;
    const inp = $("#code"), err = $("#loginErr");
    inp.addEventListener("input", () => { inp.value = normCode(inp.value); err.textContent = ""; });
    $("#loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const v = normCode(inp.value);
      if (!/^[A-Z0-9]{3}-[A-Z0-9]{5}$/.test(v)) { err.textContent = L("El código tiene 3 letras y 5 caracteres, por ejemplo {c}.", { c: "AAA-XXXXX" }); return; }
      $("#go").disabled = true; $("#go").innerHTML = L("Abriendo tu viaje…");
      const ok = await openTrip(v, false);
      if (!ok) { $("#go").disabled = false; $("#go").innerHTML = `${L("Ver mi viaje")} ${ic("chev")}`; err.textContent = notFoundMsg(); }
    });
    bindInstall();
  }

  // ---------- instalación ----------
  const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  function installCardHTML(onDark) {
    if (!IS_PWA_BUILD || isStandalone()) return "";
    const txt = isIOS() ? L("Pulsa el botón Compartir y luego «Añadir a pantalla de inicio».") : L("Tenla en tu móvil como una app, también sin internet.");
    return `<div class="card install" id="installCard" style="${onDark ? "background:rgba(255,255,255,.1);box-shadow:none;color:#fff" : ""}">
      <div class="ii">${ic("download")}</div>
      <div style="flex:1;min-width:0"><b>${L("Instala la app")}</b><small style="${onDark ? "color:rgba(255,255,255,.8)" : ""}">${txt}</small></div>
      ${isIOS() ? "" : `<button class="btn btn-sm btn-primary" type="button" id="installBtn">${L("Instalar")}</button>`}
    </div>`;
  }
  function bindInstall() {
    const b = $("#installBtn");
    if (!b) return;
    b.addEventListener("click", async () => {
      if (S.deferredPrompt) { S.deferredPrompt.prompt(); const r = await S.deferredPrompt.userChoice; S.deferredPrompt = null; if (r.outcome === "accepted") { $("#installCard")?.remove(); } }
      else toast(L("Abre el menú del navegador (⋮) y elige «Instalar app» o «Añadir a pantalla de inicio»."), 5000);
    });
  }

  // ---------- datos derivados ----------
  const T = () => S.trip;
  // Idioma del país (para frases y taxi). Por defecto, turco (viaje de Turquía).
  // Destino donde se habla lo mismo que el cliente (language.same): sin frases ni «dirección en…»; en su lugar, el cambio de moneda.
  const sameLang = () => !!(T().language && T().language.same);
  function moneyTile() {
    const c = (T().info || {}).currency;
    if (!c || !c.rate) return `<button class="qa brand" type="button" data-go="info"><span class="qi">${ic("info")}</span><span><b>${L("Info útil")}</b><small>${L("Clima, consejos y más")}</small></span></button>`;
    const r = store.get("rate:" + c.code, c.rate), v = Math.round(10 * r);
    return `<button class="qa brand" type="button" data-go="info"><span class="qi">${ic("coin")}</span><span><b>${L("Dinero")}</b><small class="num">10 € ≈ ${esc(v.toLocaleString("es-ES"))} ${esc(c.symbol)}</small></span></button>`;
  }
  const langName = () => { const g = T().language; return g ? (g[LANG] || g.es) : (LANG === "en" ? "Turkish" : "turco"); };
  const tz = () => T().tz || "+00:00";
  const plural = () => !!(T() && T().traveler && T().traveler.plural);
  const wild = () => T().wildlife || null;
  const flight = (id) => T().flights.find((f) => f.id === id);
  const hotel = (id) => T().hotels.find((h) => h.id === id);
  const place = (id) => T().places.find((p) => p.id === id);
  const city = (id) => T().cities.find((c) => c.id === id);
  const fDep = (f) => at(f.date, f.from.time, f.from.tz);
  const fArr = (f) => { let a = at(f.date, f.to.time, f.to.tz); if (a < fDep(f)) a += 864e5; return a; };
  const homeTz = () => (T().flights[0] && T().flights[0].from.tz) || tz();
  function tripPhase() {
    const n = now(), today = dateIn(n, tz());
    const first = T().flights[0];
    const startMs = first ? fDep(first) : at(T().start, "00:00", tz());
    const last = T().flights[T().flights.length - 1];
    const endMs = last ? fArr(last) : at(T().end, "23:59", tz());
    // Antes de salir se cuenta con la fecha del lugar de salida (en España aún es lunes aunque en Turquía ya sea martes).
    const todayHome = dateIn(n, homeTz());
    if (n < startMs && todayHome < T().start) return { phase: "before", today: todayHome, startMs };
    if (n > endMs + 6 * 36e5) return { phase: "after", today };
    const idx = Math.max(0, T().days.findIndex((d) => d.date === (n < startMs ? todayHome : today)));
    return { phase: n < startMs ? "departure" : "during", today: n < startMs ? todayHome : today, idx, startMs };
  }
  function nextFlight() { const n = now(); return T().flights.find((f) => fArr(f) > n); }
  function tonightHotel(dateIso) { return T().hotels.find((h) => dateIso >= h.checkIn && dateIso < h.checkOut); }
  function contactsFor(day) {
    const list = T().localContacts || [];
    const ids = day.contacts || [day.city];
    return ids.map((id) => list.find((c) => c.city === id)).filter(Boolean);
  }

  // ---------- shell ----------
  const TABS = () => [
    { id: "home", label: L("Inicio"), icon: "home" },
    { id: "plan", label: L("Itinerario"), icon: "cal" },
    ...(S.trip && S.trip.wildlife ? [{ id: "safari", label: L("Safari"), icon: "binoc" }] : []),
    { id: "map", label: L("Mapa"), icon: "map" },
    { id: "book", label: L("Reservas"), icon: "ticket" },
    { id: "info", label: L("Info"), icon: "info" },
  ];
  function renderApp() {
    if (S.trip && S.trip.page) return renderPage();
    closeSheet(true);
    document.getElementById("app").innerHTML = `
      <main id="view"></main>
      <div id="simBanner"></div>
      ${S.isPreview ? `<div class="sim-banner review-banner"><div>${L("Revisión · el cliente todavía no puede entrar")}</div></div>` : ""}
      <nav class="nav" aria-label="${L("Secciones")}"><div class="in" style="grid-template-columns:repeat(${TABS().length},1fr)">
        ${TABS().map((t) => `<button type="button" data-tab="${t.id}">${ic(t.icon)}<span>${t.label}</span></button>`).join("")}
      </div></nav>`;
    const h = (location.hash || "").replace("#", "");
    go(TABS().some((t) => t.id === h) ? h : S.tab, true);
    startTimer();
  }
  function go(tab, first) {
    if (!TABS().some((t) => t.id === tab)) tab = "home";
    S.tab = tab; store.set("tab", tab);
    document.querySelectorAll(".nav button").forEach((b) => { b.classList.toggle("on", b.dataset.tab === tab); b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"); });
    const v = $("#view");
    v.innerHTML = `<div class="view">${({ home: vHome, plan: vPlan, safari: vSafari, map: vMap, book: vBook, info: vInfo })[tab]()}</div>`;
    bindView(tab);
    renderSimBanner();
    if (!first) window.scrollTo({ top: 0 });
  }
  function topbar(onPhoto) {
    return `<div class="topbar wrap ${onPhoto ? "on-photo" : ""}">${logo("sm")}<div class="tb-actions">
      ${menuHTML()}
      <button class="icon-btn" type="button" data-act="contact" aria-label="${L("Contactar con la agencia")}">${ic("wa")}</button></div></div>`;
  }

  // ---------- INICIO ----------
  function vHome() {
    const t = T(), ph = tripPhase();
    const nights = t.hotels.reduce((s, h) => s + (h.nights || 0), 0);
    let status = "";
    if (ph.phase === "before" || ph.phase === "departure") {
      status = `<div class="card">
        <div class="card-head"><span class="pill gold">${ph.phase === "before" ? L("Cuenta atrás") : L("Hoy empieza tu viaje")}</span><span class="muted num" style="font-size:14px">${L("Salida")} ${fShort(t.flights[0].date)} · ${esc(t.flights[0].from.time)}</span></div>
        <h2 id="cdTitle">${cdTitle(ph)}</h2>
        <div class="countdown num" id="cd">${cdHTML(ph.startMs - now())}</div>
        <button class="btn btn-ghost btn-block btn-sm" type="button" data-act="preview" style="margin-top:12px">${ic("eye")} ${L("Ver cómo será durante el viaje")}</button>
      </div>`;
    } else if (ph.phase === "during") {
      const d = t.days[ph.idx];
      status = `<div class="card">
        <div class="card-head"><span class="pill live">${S.sim != null ? L("Vista previa · día {a} de {b}", { a: ph.idx + 1, b: t.days.length }) : L("Hoy · día {a} de {b}", { a: ph.idx + 1, b: t.days.length })}</span><span class="muted" style="font-size:14px">${esc(city(d.city)?.name || "")}</span></div>
        <h2>${esc(d.title)}</h2>
        <p class="muted" style="margin:4px 0 12px">${cap(fDay(d.date))}</p>
        ${metaHTML(d)}
        <div class="places">${d.blocks.map((b) => `<button class="place-row" type="button" data-act="day" data-day="${ph.idx}"><span class="pin">${ic(b.icon)}</span><span class="pn"><small>${esc(b.part)}</small><b>${esc(b.title)}</b></span>${ic("chev")}</button>`).join("")}</div>
        ${d.pack ? `<div class="pack"><span class="eyebrow">${ic("bag", "", "width:16px;height:16px;vertical-align:-3px")} ${L("Hoy en la mochila")}</span><p>${d.pack.map(esc).join(" · ")}</p></div>` : ""}
        ${contactsFor(d).length ? `<div style="margin-top:12px">${contactsHTML(contactsFor(d), true)}</div>` : ""}
      </div>`;
    } else {
      status = `<div class="card"><span class="pill">${L("Viaje terminado")}</span><h2 style="margin-top:10px">${plural() ? L("¡Bienvenidos a casa!") : L("¡Bienvenida a casa!")}</h2><p class="muted" style="margin:6px 0 0">${L("Gracias por viajar con {a}. Cuando quieras, preparamos el siguiente.", { a: esc(S.agency.name) })}</p>${S.agency.reviewUrl ? `<a class="btn btn-primary btn-block" style="margin-top:12px" href="${esc(S.agency.reviewUrl)}" target="_blank" rel="noopener">${ic("star")} ${L("Dejar una reseña")}</a>` : ""}</div>`;
    }

    const nf = nextFlight();
    const nfHTML = nf && ph.phase !== "after" ? `
      <div class="section-title"><h2>${L("Tu próximo vuelo")}</h2><button type="button" data-go="book">${L("Ver todos")}</button></div>
      ${passHTML(nf)}` : "";

    const todayIso = ph.phase === "during" ? ph.today : t.start;
    const hNow = tonightHotel(todayIso) || t.hotels[0];
    const heroImg = (ph.phase === "during" && (city(t.days[ph.idx].city) || {}).image) || t.cover;

    return `
      <section class="hero">
        <div class="hero-photo" style="background-image:url('${esc(heroImg)}')"></div>
        ${topbar(true)}
        <div class="hero-inner wrap">
          <div class="greet">${L("¡Hola, {n}!", { n: esc(t.traveler.firstName) })}</div>
          <h1>${esc(t.title)}</h1>
          <div class="dates num">${ic("cal")} ${fShort(t.start)} – ${fShort(t.end)} ${pd(t.end).getUTCFullYear()} · ${L("{d} días", { d: t.days.length })} · ${L("{n} noches", { n: nights })}</div>
          <div class="route">${t.route.map((r, i) => `${i ? `<span class="sep">${ic("plane", "", "width:14px;height:14px")}</span>` : ""}<span class="stop">${esc(r)}</span>`).join("")}</div>
        </div>
      </section>
      <div class="wrap stack lift">
        ${status}
        <div class="quick">
          <button class="qa" type="button" data-go="plan"><span class="qi">${ic("cal")}</span><span><b>${L("Mi itinerario")}</b><small>${L("Día a día")}</small></span></button>
          ${wild() ? `<button class="qa green" type="button" data-go="map"><span class="qi">${ic("map")}</span><span><b>${L("Mapa")}</b><small>${L("La ruta del safari")}</small></span></button>` : `<button class="qa gold" type="button" data-act="hotel" data-id="${esc(hNow.id)}"><span class="qi">${ic("hotel")}</span><span><b>${L("Mi hotel")}</b><small>${esc(hNow.short || hNow.name)}</small></span></button>`}
          ${wild() ? `<button class="qa brand" type="button" data-go="safari"><span class="qi">${ic("paw")}</span><span><b>${L("Cuaderno de safari")}</b><small>${L("{a} de {b} Cinco Grandes", { a: seenBig5(), b: bigFive().length })}</small></span></button>` : sameLang() ? moneyTile() : `<button class="qa brand" type="button" data-act="taxi" data-id="${esc(hNow.id)}"><span class="qi">${ic("taxi")}</span><span><b>${L("Para el taxista")}</b><small>${L("Dirección en {l}", { l: langName() })}</small></span></button>`}
          <button class="qa wa" type="button" data-act="contact"><span class="qi">${ic("wa")}</span><span><b>${L("Mi agencia")}</b><small>${L("{n} te ayuda", { n: esc(S.agency.agent.firstName) })}</small></span></button>
        </div>
        ${nfHTML ? `<div>${nfHTML}</div>` : ""}
        <div>
          <div class="section-title"><h2>${L("Tu viaje en {n} días", { n: t.days.length })}</h2><button type="button" data-go="plan">${L("Ver todo")}</button></div>
          <div class="strip">${t.days.map((d, i) => `
            <button class="dcard" type="button" data-act="day" data-day="${i}">
              <span class="ph" style="background-image:url('${esc(d.image)}')"></span>
              ${ph.phase === "during" && ph.idx === i ? `<span class="badge">${L("HOY")}</span>` : ""}
              <span class="tx"><small>${L("Día {n}", { n: i + 1 })} · ${cap(D().WDS[pd(d.date).getUTCDay()])} ${pd(d.date).getUTCDate()}</small><b>${esc(d.title)}</b></span>
            </button>`).join("")}</div>
        </div>
        ${wild() ? safariTeaser() : ""}
        ${ph.phase !== "after" ? checklistCard() : ""}
        ${installCardHTML(false)}
        ${footHTML()}
      </div>`;
  }
  function cdTitle(ph) {
    const ms = ph.startMs - now();
    if (ms <= 0) return L("¡Buen viaje!");
    // Días de calendario en la zona de salida, no bloques de 24 h.
    const f = T().flights[0];
    const days = Math.round((pd(f.date) - pd(dateIn(now(), f.from.tz))) / 864e5);
    if (days <= 0) return L("¡Hoy sales de viaje!");
    if (days === 1) return L("¡Mañana empieza tu viaje!");
    return L("Faltan {n} días para tu viaje", { n: days });
  }
  function cdHTML(ms) {
    ms = Math.max(0, ms);
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    const c = (v, l) => `<div><b>${String(v).padStart(2, "0")}</b><small>${l}</small></div>`;
    return c(d, L("días")) + c(h, L("horas")) + c(m, L("min")) + c(s, L("seg"));
  }
  function checklistCard() {
    const list = T().checklist || [];
    if (!list.length) return "";
    const done = store.get("check:" + T().code, []);
    const n = list.filter((_, i) => done.includes(i)).length;
    return `<button class="card" type="button" data-act="checklist" style="border:0;text-align:left;cursor:pointer;display:grid;gap:10px">
      <div class="card-head" style="margin:0"><span><span class="eyebrow">${L("Antes de salir")}</span><h2 style="font-size:22px;margin-top:2px">${L("Tu maleta")}</h2></span><span class="pill num">${n} / ${list.length}</span></div>
      <div class="bar"><i style="width:${Math.round((n / list.length) * 100)}%"></i></div>
      <span class="muted" style="font-size:15px">${L("Toca para revisar lo que no te puedes olvidar.")}</span>
    </button>`;
  }
  function footHTML(extra = "") {
    return `<div class="foot">${logo("sm")}<span>${esc(S.agency.tagline || "")}</span><span class="num">${L("Reserva {c}", { c: esc(T().code) })}</span>${extra}</div>`;
  }

  // ---------- pase de embarque ----------
  function passHTML(f, mini) {
    const mins = Math.round((fArr(f) - fDep(f)) / 6e4);
    return `<div class="pass ${mini ? "mini" : ""}">
      ${mini ? "" : `<div class="pass-top"><b>${esc(f.airline)} · ${esc(f.number)}</b><span>${fWdShort(f.date)}</span></div>`}
      <div class="pass-main">
        <div class="end"><div class="iata">${esc(f.from.code)}</div><div class="city">${esc(f.from.city)}</div><div class="time num">${esc(f.from.time)}</div></div>
        <div class="mid">${ic("plane")}<span class="line"></span><span>${dur(mins)}</span></div>
        <div class="end r"><div class="iata">${esc(f.to.code)}</div><div class="city">${esc(f.to.city)}</div><div class="time num">${esc(f.to.time)}</div></div>
      </div>
      ${mini ? `<div class="pass-foot"><div><small>${L("Vuelo")}</small><b>${esc(f.number)}</b></div><div><small>${L("Compañía")}</small><b>${esc(f.airline)}</b></div></div>` : `
      <div class="pass-foot">
        ${f.locators ? f.locators.map((x) => `<div><small>${L("Localizador")} · ${esc(x.name)}</small><b class="num">${esc(x.code)}</b></div>`).join("") : `<div><small>${L("Localizador")}</small>${f.locator ? `<b class="num">${esc(f.locator)}</b>` : `<span class="pend">${L("Te lo envía tu agencia")}</span>`}</div>`}
        <div><small>${L("Sale de")}</small><b>${esc(f.from.airport)}</b></div>
        ${f.bags ? `<div><small>${L("Equipaje")}</small><b>${esc(f.bags)}</b></div>` : ""}
        ${f.note ? `<div style="flex-basis:100%"><small>${L("Nota")}</small><b style="font-weight:500">${esc(f.note)}</b></div>` : ""}
      </div>`}
    </div>`;
  }

  // Escala entre dos vuelos seguidos (si el siguiente sale del mismo aeropuerto en menos de 24 h).
  function layoverHTML(a, b) {
    const gap = Math.round((fDep(b) - fArr(a)) / 6e4);
    if (a.to.code !== b.from.code || gap <= 0 || gap > 24 * 60) return "";
    return `<div class="layover">${ic("clock", "", "width:18px;height:18px")}<span>${L("Escala en {c}", { c: esc(a.to.city) })} · <b class="num">${dur(gap)}</b></span></div>`;
  }

  // ---------- contacto local ----------
  function contactsHTML(list, compact) {
    return `<div class="local ${compact ? "compact" : ""}">${list.map((c) => `
      <div class="local-row">
        <span class="lic">${ic("guide")}</span>
        <span class="lt"><small>${L("Tu contacto en destino")}</small><b>${esc(c.name)}</b><span class="num">${c.phone ? esc(c.phone) : esc(c.email || L("Teléfono pendiente"))}${c.detail ? " · " + esc(c.detail) : ""}</span></span>
        ${c.phone ? `<a class="call" href="tel:${digits(c.phone)}" aria-label="${L("Llamar a {n}", { n: esc(c.name) })}">${ic("phone")}</a>` : c.email ? `<a class="call" href="mailto:${esc(c.email)}" aria-label="${L("Escribir a {n}", { n: esc(c.name) })}">${ic("mail")}</a>` : ""}
      </div>`).join("")}</div>`;
  }

  // ---------- ITINERARIO ----------
  function vPlan() {
    const t = T(), ph = tripPhase();
    return `
      <div class="daytabs"><div class="wrap">${t.days.map((d, i) => {
        const dt = pd(d.date);
        return `<button class="dchip ${ph.phase === "during" && ph.idx === i ? "today" : ""}" type="button" data-jump="d${i}"><small>${D().WDS[dt.getUTCDay()]}</small><b class="num">${dt.getUTCDate()}</b></button>`;
      }).join("")}</div></div>
      <div class="wrap">
        <div class="page-title"><span class="eyebrow">${fShort(t.start)} – ${fShort(t.end)}</span><h1>${L("Tu itinerario")}</h1>${t.scheduleNote ? `<span class="muted" style="font-size:15px">${esc(t.scheduleNote)}</span>` : ""}</div>
        ${t.days.map((d, i) => dayHTML(d, i, ph)).join("")}
        ${footHTML()}
      </div>`;
  }
  function dayHTML(d, i, ph) {
    const stay = d.stay ? hotel(d.stay) : null;
    const cts = contactsFor(d);
    return `<section class="day" id="d${i}">
      <div class="day-hero"><div class="ph" style="background-image:url('${esc(d.image)}')"></div>
        ${ph.phase === "during" && ph.idx === i ? `<span class="badge">${L("HOY")}</span>` : ""}
        <div class="tx"><small>${L("Día {n}", { n: i + 1 })} · ${fDay(d.date)}</small><h2>${esc(d.title)}</h2><span>${esc(d.subtitle || "")}</span></div>
      </div>
      ${d.meta ? `<div style="margin-top:12px">${metaHTML(d)}</div>` : ""}
      ${d.tip ? `<div class="tip">${ic("star")}<span>${esc(d.tip)}</span></div>` : ""}
      <div class="timeline">${d.blocks.map((b, bi) => `
        <div class="tl"><div class="tl-dot">${ic(b.icon)}</div>
          <div class="tl-body">
            <span class="part">${esc(b.part)}</span>
            <h3>${esc(b.title)}</h3>
            ${b.text ? `<p>${esc(b.text)}</p>` : ""}

  function placeRow(p) {

  // ---------- MAPA ----------
  function proj(lat, lng) {
    const m = S.map.proj;
    if (m.type === "merc") { // mapa satélite en Web Mercator (las teselas)
      const n = 256 * 2 ** m.z, sn = Math.sin(lat * Math.PI / 180);
      return [((lng + 180) / 360 * n - m.x0) * m.k, ((0.5 - Math.log((1 + sn) / (1 - sn)) / (4 * Math.PI)) * n - m.y0) * m.k];
    }
    return [(lng - m.lon0) * m.k * m.sx, (m.lat1 - lat) * m.sx];
  }
  function vMap() {
    const t = T();
    const sel = S.mapCity || (t.cities.find((c) => !c.home) || {}).id;
    S.mapCity = sel;
    let svg = "";
    if (S.map) {
      const m = S.map, pins = t.cities.filter((c) => !c.home);
      const home = t.cities.find((c) => c.home);
      const pts = {}; pins.forEach((c) => (pts[c.id] = proj(c.lat, c.lng)));
      const order = (t.routeIds || []).map((id) => city(id));
      const V = m.view || [0, 20, 520, 430];
      const F = m.from || [V[0], V[1] + V[3] / 2];
      // Un solo trazo por tramo (ida y vuelta comparten línea) para que el mapa se lea limpio.
      let routes = ""; const seen = {};
      for (let i = 0; i < order.length - 1; i++) {
        const a = order[i], b = order[i + 1];
        if (!a || !b) continue;
        const key = [a.id, b.id].sort().join("-"); if (seen[key]) continue; seen[key] = 1;
        const A = a.home ? F : pts[a.id], B = b.home ? F : pts[b.id];
        const mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2;
        const dx = B[0] - A[0], dy = B[1] - A[1], Ln = Math.hypot(dx, dy) || 1, bend = Math.min(70, Ln * 0.22);
        routes += `<path class="rt" d="M${A[0]} ${A[1]} Q${mx + (dy / Ln) * bend} ${my - (dx / Ln) * bend} ${B[0]} ${B[1]}"/>`;
      }
      const lb = (m.labels && (m.labels[LANG] || m.labels.es)) || [];
      const ct = m.country && (m.country[LANG] || m.country.es);
      svg = `<svg class="map-svg wide ${m.image ? "sat" : ""}" viewBox="${V.join(" ")}" role="img" aria-label="${L("Mapa de {d} con las paradas del viaje", { d: esc(t.destination) })}">
        <rect x="${V[0] - 50}" y="${V[1] - 50}" width="${V[2] + 100}" height="${V[3] + 100}" class="sea"/>
        ${m.image ? `<image href="${esc(m.image)}" x="${V[0]}" y="${V[1]}" width="${V[2]}" height="${V[3]}" preserveAspectRatio="none"/><rect class="sat-shade" x="${V[0]}" y="${V[1]}" width="${V[2]}" height="${V[3]}"/>${m.border ? `<path class="border" d="${m.border}"/>` : ""}` : `<path class="land" d="${m.oth}"/>
        <path class="tr" d="${m.tr}"/>`}
        ${m.lakes ? `<path class="lake" d="${m.lakes}"/>` : ""}
        ${(m.marks || []).map((k) => { const [x, y] = k.xy, end = k.anchor === "end"; return `<g class="mark ${esc(k.kind || "")}">${k.kind === "town" ? `<circle cx="${x}" cy="${y}" r="6"/>` : `<path d="M${x - 13} ${y + 9}L${x} ${y - 12}L${x + 13} ${y + 9}Z"/>`}<text x="${end ? x - 18 : x + 16}" y="${y + (k.dy || 6)}" text-anchor="${end ? "end" : "start"}">${esc(k[LANG] || k.es)}</text></g>`; }).join("")}
        ${ct ? `<text class="country-label" x="${ct[1]}" y="${ct[2]}" text-anchor="middle">${esc(ct[0])}</text>` : ""}
        ${lb.map((x) => `<text class="sea-label" x="${x[1]}" y="${x[2]}">${esc(x[0])}</text>`).join("")}
        ${routes}
        ${home ? `<g class="from"><text x="${F[0] + 14}" y="${F[1] - 16}">✈ ${L("Desde {c}", { c: esc(home.name) })}</text></g>` : ""}
        ${pins.map((c) => { const [x, y] = pts[c.id]; return `
          <g class="pin ${c.id === sel ? "on" : ""}" data-city="${esc(c.id)}" tabindex="0" role="button" aria-label="${esc(c.name)}">
            <circle class="halo" cx="${x}" cy="${y}" r="30"/><circle class="dot" cx="${x}" cy="${y}" r="17"/>
            ${(() => { const [dx, dy, an] = c.label || [30, 6, "start"]; return `<text x="${x + dx}" y="${y + dy}" text-anchor="${an}">${esc(c.short || c.name)}</text>
            <text class="sub" x="${x + dx}" y="${y + dy + 32}" text-anchor="${an}">${c.nights ? c.nights + " " + (c.nights === 1 ? L("NOCHE") : L("NOCHES")) : ""}</text>`; })()}
            <circle cx="${x}" cy="${y}" r="55" fill="transparent"/>
          </g>`; }).join("")}
      </svg>`;
    }
    const c = city(sel);
    const plist = t.places.filter((p) => p.city === sel);
    const hs = t.hotels.filter((h) => h.city === sel);
    return `${topbar(false)}
      <div class="wrap">
        <div class="page-title"><span class="eyebrow">${esc(t.destination)}</span><h1>${L("Mapa del viaje")}</h1><span class="muted" style="font-size:15px">${t.mapHint ? esc(t.mapHint) : L("Toca una ciudad para ver sus lugares.")}</span></div>
        <div class="map-card">${svg || `<div style="padding:24px" class="muted">${L("Mapa no disponible.")}</div>`}</div>
        ${S.map && S.map.credit ? `<div class="map-credit">${esc(S.map.credit)}</div>` : ""}
        <div class="city-tabs">${t.cities.filter((x) => !x.home).map((x) => `
          <button class="city-tab ${x.id === sel ? "on" : ""}" type="button" data-city="${esc(x.id)}"><span class="ph" style="background-image:url('${esc(x.image)}')"></span><span><b>${esc(x.name)}</b><small>${x.sub ? esc(x.sub) : `${L("{n} lugares", { n: t.places.filter((p) => p.city === x.id).length })} · ${L("{n} noches", { n: x.nights || 0 })}`}</small></span></button>`).join("")}
        </div>
        <div class="section-title"><h2>${esc(c ? c.name : "")}</h2><a class="btn btn-sm btn-ghost" href="${mapsUrl((c.local || c.name) + ", " + (T().country || "Türkiye"))}" target="_blank" rel="noopener">${ic("map")} ${L("Abrir mapa")}</a></div>
        <div class="list">
          ${hs.map((h) => `<button class="li" type="button" data-act="hotel" data-id="${esc(h.id)}"><span class="lic" style="color:var(--accent-ink);background:var(--warn-soft)">${ic("hotel")}</span><span class="lt"><b>${esc(h.name)}</b><small>${esc(fWdShort(h.checkIn))} · ${h.nights === 1 ? L("1 noche") : L("{n} noches", { n: h.nights })}${h.pending ? " · " + L("Pendiente") : ""}</small></span>${ic("chev", "chev")}</button>`).join("")}
          ${plist.map((p) => `<button class="li" type="button" data-act="${p.kind === "park" ? "park" : "place"}" data-id="${esc(p.id)}"><span class="lic" style="color:var(--sea);background:var(--sea-soft)">${ic(p.kind === "hotel" ? "hotel" : "pin")}</span><span class="lt"><b>${esc(p.name)}</b><small>${esc(p.kind === "hotel" ? L("Visita de inspección") : (p.local || p.es || ""))}</small></span>${ic("chev", "chev")}</button>`).join("")}
        </div>
        ${footHTML()}
      </div>`;
  }

  function onClick(e) {

    if (!S.trip && el.dataset.act !== "big") return;

  function setupDayObserver() {

  // ---------- voz ----------
  function speak(k, btn) {
    const p = (T().phrases || [])[k];
    if (!p) return;
    if (!("speechSynthesis" in window)) return toast(L("Se pronuncia: {p}", { p: p.say }));
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance((p.local || p.tr).replace(/\s*\/\s*/g, ", "));
      const g = T().language || {}, sl = g.speech || "tr-TR";
      const vs = speechSynthesis.getVoices(), pick = (l) => vs.find((x) => x.lang.toLowerCase().replace("_", "-").startsWith(l.slice(0, 2).toLowerCase()));
      let v = pick(sl), lang = sl;
      if (!v && g.fallback && vs.length) { v = pick(g.fallback); lang = g.fallback; }
      u.lang = lang; u.rate = 0.85;
      if (v) u.voice = v;
      document.querySelectorAll(".speak.on").forEach((b) => b.classList.remove("on"));
      btn.classList.add("on");
      u.onend = u.onerror = () => btn.classList.remove("on");
      speechSynthesis.speak(u);
      setTimeout(() => btn.classList.remove("on"), 4000);
    } catch (e) { toast(L("Se pronuncia: {p}", { p: p.say })); }
  }

  }

  // ---------- PWA ----------
  if (IS_PWA_BUILD && "serviceWorker" in navigator) {
    // Actualización automática: al volver a la app se busca versión nueva y, si la hay, se recarga sola.
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloading) { reloading = true; location.reload(); } });
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then((reg) => {
      const check = () => reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
      setInterval(check, 30 * 60 * 1000);
    }).catch(() => {}));
  }

  boot();
})();

</script>
